<!DOCTYPE html>
<html lang="id" data-theme="light" data-canvas="light" data-view="print">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#185abd">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>Dokumen — Word Web</title>
<style>
  :root{
    --accent:#185abd; --accent-2:#0f4a9e; --accent-soft:#e7eefb; --accent-line:#c3d4f2;
    --bg:#eef0f3; --panel:#ffffff; --panel-2:#f6f7f9; --panel-3:#eceef2;
    --text:#1f2328; --muted:#5f6672; --border:#d9dde3; --border-soft:#e9ecf0;
    --paper:#ffffff; --ink:#111418;
    --shadow:0 1px 2px rgba(16,24,40,.08), 0 10px 30px rgba(16,24,40,.13);
    --page-w:21cm; --page-h:29.7cm; --pad-x:2.2cm; --pad-y:2cm;
    --r:7px;
  }
  html[data-theme="dark"]{
    --bg:#141618; --panel:#1d2023; --panel-2:#24282c; --panel-3:#2b3035;
    --text:#e6e9ed; --muted:#9aa3ad; --border:#373c42; --border-soft:#2b3035;
    --accent:#8ab4f8; --accent-2:#5b8def; --accent-soft:#24303f; --accent-line:#33445c;
    --shadow:0 1px 2px rgba(0,0,0,.6), 0 12px 34px rgba(0,0,0,.5);
  }
  html[data-canvas="dark"]{ --bg:#0c0e10; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text); overflow:hidden;
    font:13px/1.4 "Segoe UI", Inter, system-ui, -apple-system, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font-family:inherit;color:inherit}
  #app{display:flex;flex-direction:column;height:100vh}

  /* ================= Title bar ================= */
  .titlebar{
    display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;
    background:var(--accent); color:#fff; flex:0 0 auto; z-index:40;
  }
  html[data-theme="dark"] .titlebar{background:linear-gradient(180deg,#1b2b40,#16222f)}
  .tb-left,.tb-right{display:flex;align-items:center;gap:8px;min-width:0}
  .tb-left{flex:0 0 auto}
  .logo{
    width:22px;height:22px;border-radius:5px;background:#fff;color:var(--accent);
    display:grid;place-items:center;font-weight:800;font-size:13px;flex:0 0 auto;
  }
  .save-state{font-size:11.5px;opacity:.85;white-space:nowrap}
  .doc-title{flex:1 1 auto;display:flex;justify-content:center;min-width:0}
  .doc-title input{
    max-width:440px;width:100%;background:transparent;border:1px solid transparent;border-radius:5px;
    color:#fff;text-align:center;font-size:13px;padding:4px 8px;outline:none;text-overflow:ellipsis;
  }
  .doc-title input:hover{background:rgba(255,255,255,.1)}
  .doc-title input:focus{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45)}
  .tb-right{flex:0 0 auto}
  .tb-search{
    display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:3px 10px;
  }
  .tb-search input{background:none;border:0;outline:none;color:#fff;width:130px;font-size:12px}
  .tb-search input::placeholder{color:rgba(255,255,255,.7)}
  .tb-search svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2}
  .tb-ico{
    background:transparent;border:1px solid transparent;border-radius:5px;color:#fff;
    width:28px;height:26px;display:grid;place-items:center;cursor:pointer;
  }
  .tb-ico:hover{background:rgba(255,255,255,.18)}
  .tb-ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tb-share{
    background:#fff;color:var(--accent);border:0;border-radius:5px;padding:5px 12px;
    font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .tb-share:hover{background:#eaf1ff}

  /* ================= Tabs ================= */
  .tabs{
    display:flex;gap:1px;padding:0 8px;background:var(--panel);
    border-bottom:1px solid var(--border);flex:0 0 auto;overflow-x:auto;scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    background:none;border:0;border-bottom:2px solid transparent;padding:8px 13px;
    font-size:12.5px;color:var(--muted);cursor:pointer;white-space:nowrap;border-radius:5px 5px 0 0;
  }
  .tab:hover{background:var(--panel-2);color:var(--text)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  .tab.file{color:#b3261e;font-weight:600}
  html[data-theme="dark"] .tab.file{color:#f28b82}
  .tab.file:hover{background:#fdecea}
  html[data-theme="dark"] .tab.file:hover{background:#3a2220}

  /* ================= Ribbon ================= */
  #ribbon{background:var(--panel);border-bottom:1px solid var(--border);flex:0 0 auto;z-index:30}
  .ribbon-pane{display:none;padding:5px 8px 1px;flex-wrap:wrap;row-gap:3px}
  .ribbon-pane.active{display:flex;min-height:80px;align-items:stretch}
  .group{
    display:flex;flex-direction:column;justify-content:space-between;padding:0 7px;
    border-right:1px solid var(--border-soft);min-width:0;
  }
  .group:last-child{border-right:0}
  .gitems{display:flex;align-items:center;gap:2px;flex-wrap:wrap;max-width:100%}
  .glabel{font-size:10px;color:var(--muted);text-align:center;padding:2px 0 3px;letter-spacing:.25px;text-transform:uppercase}
  .rb{
    display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    min-width:28px;height:28px;padding:0 5px;background:transparent;border:1px solid transparent;
    border-radius:5px;cursor:pointer;color:var(--text);flex:0 0 auto;
  }
  .rb:hover{background:var(--panel-2);border-color:var(--border)}
  .rb:active{background:var(--accent-soft)}
  .rb.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
  .rb .ico{display:grid;place-items:center;width:17px;height:17px;font-size:12px;line-height:1}
  .rb .ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .rb .lbl{font-size:9.5px;line-height:1;opacity:.8;white-space:nowrap}
  .rb.big{height:50px;min-width:48px;padding:3px 7px;gap:2px}
  .rb.big .ico,.rb.big .ico svg{width:21px;height:21px}
  .rb.big .lbl{font-size:10px}
  .rb.wide{flex-direction:row;gap:5px;height:28px;padding:0 8px}
  .rb .tx{font-family:Georgia,serif;font-size:14px;line-height:1}
  .rb .tx.b{font-weight:800;font-family:"Segoe UI",Arial,sans-serif}
  .rb .tx.i{font-style:italic}
  .rb .tx.u{text-decoration:underline}
  .rb .tx.s{text-decoration:line-through}
  .rb.color{position:relative;overflow:hidden}
  .rb.color input[type=color]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
  .rb.color .bar{display:block;height:3px;width:15px;border-radius:2px;margin-top:1px}
  .rsel{
    height:26px;border:1px solid var(--border);border-radius:5px;background:var(--panel);
    font-size:12px;padding:0 4px;cursor:pointer;max-width:100%;
  }
  .rsel:hover{border-color:var(--accent)}
  .split{position:relative}
  .split .caret{width:11px;height:11px;opacity:.65}
  .sep{width:1px;height:20px;background:var(--border-soft);margin:0 3px}
  .stylecard{
    display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:74px;height:50px;
    padding:3px 8px;border:1px solid var(--border);border-radius:4px;background:var(--panel);
    cursor:pointer;text-align:left;overflow:hidden;
  }
  .stylecard:hover{border-color:var(--accent);background:var(--accent-soft)}
  .stylecard b{font-size:12px;font-weight:600;white-space:nowrap}
  .stylecard i{font-size:9.5px;color:var(--muted);font-style:normal;white-space:nowrap}

  /* ================= Workspace ================= */
  .workspace{flex:1 1 auto;display:flex;min-height:0;background:var(--bg)}
  .canvas{
    flex:1 1 auto;overflow:auto;padding:14px 16px 70px;position:relative;scroll-behavior:smooth;
  }
  .sidepane{
    width:250px;flex:0 0 auto;background:var(--panel);border-right:1px solid var(--border);
    display:none;flex-direction:column;min-height:0;
  }
  .sidepane.right{border-right:0;border-left:1px solid var(--border);width:280px}
  .sidepane.show{display:flex}
  .pane-head{
    display:flex;align-items:center;justify-content:space-between;padding:8px 10px;
    border-bottom:1px solid var(--border);font-weight:600;font-size:12.5px;flex:0 0 auto;
  }
  .pane-head .x{background:none;border:0;cursor:pointer;color:var(--muted);font-size:13px}
  .pane-head .x:hover{color:var(--text)}
  .sidepane input#navSearch{
    margin:8px;height:28px;border:1px solid var(--border);border-radius:5px;padding:0 8px;
    background:var(--panel-2);outline:none;font-size:12px;flex:0 0 auto;
  }
  .nav-list{overflow:auto;padding:0 6px 10px}
  .nav-item{
    display:block;width:100%;text-align:left;background:none;border:0;padding:5px 7px;border-radius:4px;
    cursor:pointer;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .nav-item:hover{background:var(--panel-2)}
  .nav-item.lv1{font-weight:600}
  .nav-item.lv2{padding-left:20px}
  .nav-item.lv3{padding-left:34px;color:var(--muted)}
  .nav-empty{padding:14px 10px;color:var(--muted);font-size:12px;text-align:center}
  .nav-flash{background:#fff3a3 !important;transition:background .4s}

  /* ================= Ruler & page ================= */
  .ruler-row{display:none;justify-content:center;margin-bottom:6px;position:sticky;top:0;z-index:5}
  .ruler-row.show{display:flex}
  .ruler{
    width:var(--page-w);height:20px;background:var(--panel);border:1px solid var(--border);
    border-radius:3px;position:relative;overflow:hidden;flex:0 0 auto;
  }
  .ruler .tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--border)}
  .ruler .tick.major{border-left-color:#b9c0ca}
  .ruler .num{position:absolute;top:2px;font-size:8.5px;color:var(--muted);transform:translateX(2px)}
  .ruler .margin-band{position:absolute;top:0;bottom:0;background:rgba(43,87,154,.07);border-right:1px solid var(--accent-line);border-left:1px solid var(--accent-line)}

  .page{
    width:var(--page-w);min-height:var(--page-h);margin:0 auto;position:relative;
    background:var(--paper);box-shadow:var(--shadow);border-radius:2px;
    padding:calc(var(--pad-y) * .55) var(--pad-x) calc(var(--pad-y) * .55);
    display:flex;flex-direction:column;transition:width .15s ease;
  }

  /* ================= Paged view (lembar per halaman) ================= */
  .sheets{position:absolute;inset:0;z-index:0;pointer-events:none}
  .sheet{
    position:absolute;left:0;right:0;background:var(--paper);
    box-shadow:var(--shadow);border-radius:2px;
  }
  .sheet-no{
    position:absolute;right:-40px;top:2px;font:11px/1 "Segoe UI",Arial,sans-serif;
    color:var(--muted);opacity:.7;user-select:none;text-align:left;
  }
  .sheet-wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .sheet-wm span{
    font-size:86pt;font-weight:700;color:rgba(24,90,189,.07);
    transform:rotate(-32deg);white-space:nowrap;letter-spacing:6px;
  }
  .sheet-hf{position:absolute;font-size:9.5pt;color:#6b7280;overflow:hidden;line-height:1.35}
  .sheet-hf.bot{display:flex;align-items:flex-end}
  .page.paginated{background:transparent;box-shadow:none}
  .page.paginated .watermark,.page.paginated .page-border{display:none !important}
  .page.paginated .pagebreak{border:0;height:0;margin:0}
  .page.paginated .pagebreak::after{display:none}
  .page.paginated .hf{position:relative;z-index:1}
  .page.paginated .paper{z-index:1}
  .page.paginated .sheet-pb{border:2px solid #b9c0ca}
  .page.paginated .sheet-pb.style-double{border:4px double #b9c0ca}
  .page.paginated .sheet-pb.style-shadow{box-shadow:4px 4px 0 rgba(0,0,0,.12)}
  /* tabel yang lebih tinggi dari satu halaman tetap terbaca saat melewati celah */
  .page.paginated .paper table,.page.paginated .paper td{background-color:var(--paper)}
  .page.paginated .paper th{background-color:#eef2f8}
  html[data-view="web"] .sheets,html[data-view="read"] .sheets{display:none}
  .hf{
    flex:0 0 auto;font-size:9.5pt;color:#6b7280;min-height:18px;outline:none;
    border-bottom:1px dotted transparent;padding:2px 0;
  }
  .hf:hover{border-bottom-color:#d5dae2}
  .hf:empty::before{content:attr(data-ph);color:#c2c8d0;font-size:9pt}
  .hf.off{display:none}
  .hf-bottom{margin-top:auto;border-top:1px dotted transparent;border-bottom:0;padding-top:4px}
  .hf-bottom:hover{border-top-color:#d5dae2}
  .paper{
    flex:1 1 auto;outline:none;color:var(--ink);
    font-family:Calibri, Carlito, "Segoe UI", Arial, sans-serif;font-size:11pt;line-height:1.5;
    word-wrap:break-word;position:relative;z-index:1;min-height:60px;
  }
  .paper:empty::before{content:"Mulai menulis…";color:#a7aeb8}

  /* ================= Document content ================= */
  .paper p{margin:0 0 8pt}
  .paper h1,.paper h2,.paper h3,.paper h4,.paper h5,.paper h6{margin:12pt 0 6pt;font-weight:600;line-height:1.28}
  .paper h1{font-size:22pt}
  .paper h2{font-size:16pt}
  .paper h3{font-size:13pt}
  .paper h4{font-size:11.5pt}
  .paper h5{font-size:11pt}
  .paper h6{font-size:10.5pt;color:#4b5563}
  .paper blockquote{margin:9pt 0;padding:6pt 12pt;border-left:3px solid var(--accent);background:#f5f8fc;color:#374151}
  .paper pre{background:#f4f6f8;border:1px solid #e3e7ec;border-radius:5px;padding:8pt 10pt;
    font-family:"Cascadia Mono",Consolas,"Courier New",monospace;font-size:9.5pt;white-space:pre-wrap;margin:8pt 0}
  .paper code{font-family:"Cascadia Mono",Consolas,monospace;font-size:.9em;background:#f1f3f6;padding:1px 4px;border-radius:3px}
  .paper ul,.paper ol{margin:0 0 8pt;padding-left:26pt}
  .paper li{margin:1.5pt 0}
  .paper table{border-collapse:collapse;width:100%;margin:8pt 0;font-size:10.5pt;table-layout:auto}
  .paper th,.paper td{border:1px solid #b9c0ca;padding:4pt 7pt;vertical-align:top;min-width:26px;position:relative}
  .paper th{background:#eef2f8;font-weight:600;text-align:left}
  .paper img{max-width:100%;height:auto;vertical-align:bottom}
  .paper a{color:#1a5fb4;text-decoration:underline}
  .paper hr{border:0;border-top:1px solid #c3c9d1;margin:10pt 0}
  .paper mark{background:#fff3a3;color:inherit}
  .paper .pagebreak{height:0;border-top:2px dashed #c9cfd8;margin:16pt 0;position:relative}
  .paper .pagebreak::after{
    content:"Hentian halaman";position:absolute;right:0;top:-8px;background:#fff;color:#9aa3ad;
    font:9.5px/1 "Segoe UI",Arial,sans-serif;padding:0 5px;
  }
  .paper .colbreak{height:0;border-top:1px dashed #d8b4b4;margin:12pt 0;position:relative}
  .paper .colbreak::after{content:"Hentian kolom";position:absolute;right:0;top:-8px;background:#fff;color:#b08a8a;font:9px/1 "Segoe UI",Arial;padding:0 4px}

  /* styles */
  .paper .st-title{font-size:26pt;font-weight:400;letter-spacing:-.2px;margin:0 0 4pt;line-height:1.15}
  .paper .st-subtitle{font-size:13pt;color:#5b6470;font-weight:400;margin:0 0 14pt}
  .paper .st-quote{border-left:3px solid var(--accent);padding:4pt 12pt;color:#374151;font-style:italic;margin:9pt 0}
  .paper .st-intense{border-left:4px solid var(--accent);background:#eef3fb;padding:8pt 12pt;margin:9pt 0}
  .paper .st-code{font-family:Consolas,monospace;background:#f4f6f8;border:1px solid #e3e7ec;padding:8pt 10pt;font-size:9.5pt;white-space:pre-wrap}
  .paper .st-nospace{margin:0}
  .paper .st-caption{font-size:9pt;color:#5b6470;font-style:italic;text-align:center;margin:2pt 0 10pt}
  .paper .st-list{font-size:11pt}

  /* marks */
  .paper.marks p::after{content:"¶";color:#b9c2cc;font-size:.8em;margin-left:2px}
  .paper.marks br::after{content:"↵";color:#c8d0d9;font-size:.75em}
  .paper.marks li::before{content:"·";color:#c8d0d9;margin-right:3px}
  .paper.marks td::after{content:"";}

  /* review markup */
  .paper ins.trk{color:#1a7f37;background:#e7f6ec;text-decoration:underline}
  .paper del.trk{color:#b3261e;background:#fdecea;text-decoration:line-through}
  .paper .cmt-hl{background:#fff2b8;border-bottom:1.5px solid #e0a800}
  .paper .cmt-hl.active{background:#ffe27a}
  .paper sup.fn{color:var(--accent);font-weight:600;cursor:pointer;padding:0 1px}
  .paper .fnbox{
    border-top:1px solid #c3c9d1;margin-top:14pt;padding-top:6pt;font-size:9pt;color:#374151;
  }
  .paper .fnbox .fnline{margin:0 0 3pt;text-indent:-14pt;padding-left:14pt}
  .paper .toc{border:0;padding:0;margin:6pt 0 12pt}
  .paper .toc .toc-item{display:flex;gap:6px;align-items:baseline;text-decoration:none;color:inherit;margin:2pt 0}
  .paper .toc .toc-item .dots{flex:1;border-bottom:1px dotted #b9c0ca;transform:translateY(-3px)}
  .paper .toc .lv1{font-weight:600}
  .paper .toc .lv2{padding-left:16px}
  .paper .toc .lv3{padding-left:32px;font-size:.95em}
  .paper .toc-title{font-size:15pt;font-weight:600;margin:0 0 8pt}

  /* objects */
  .paper .shape{display:inline-block;vertical-align:middle;margin:4pt 0;max-width:100%}
  .paper .chart{display:block;margin:8pt auto;max-width:100%}
  .paper .tbox{
    border:1px solid #9aa3ad;border-radius:4px;padding:8pt 10pt;margin:8pt 0;min-height:48px;
    background:#fbfcfe;
  }
  .paper .wordart{
    font-family:Georgia,serif;font-size:30pt;font-weight:800;letter-spacing:1px;margin:8pt 0;
    background:linear-gradient(135deg,#185abd,#8a2be2 60%,#c0392b);-webkit-background-clip:text;
    background-clip:text;color:transparent;-webkit-text-stroke:.4px rgba(0,0,0,.12);
  }
  .paper .dropcap::first-letter{
    float:left;font-size:3.2em;line-height:.85;padding:2px 6px 0 0;font-weight:600;color:var(--accent);
  }
  .paper .eq{font-family:"Cambria Math",Cambria,Georgia,serif;font-style:italic;font-size:12pt}
  .paper .bookmark{background:#dbeafe;border-bottom:1px dashed #2563eb}
  .paper .caption{font-size:9pt;color:#5b6470;font-style:italic;text-align:center;margin:2pt 0 10pt}

  .paper .sel-obj{outline:2px solid var(--accent);outline-offset:2px}
  .paper.linenums{counter-reset:ln}
  .paper.linenums > *{counter-increment:ln;position:relative}
  .paper.linenums > *::before{
    content:counter(ln);position:absolute;left:-2em;top:0;font-size:8.5pt;color:#9aa3ad;
    font-family:"Segoe UI",Arial,sans-serif;font-style:normal;
  }
  .paper.sp-tight p{margin-bottom:3pt}
  .paper.sp-normal p{margin-bottom:8pt}
  .paper.sp-loose p{margin-bottom:14pt;line-height:1.7}
  .paper .pgfield{font-size:9.5pt;color:#4b5563}
  .hf .pgfield,.sheet-hf .pgfield{float:right;font-size:9.5pt;color:#4b5563}
  .paper .cover{page-break-after:auto}

  /* page decorations */
  .watermark{
    position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    pointer-events:none;z-index:0;overflow:hidden;
  }
  .watermark.show{display:flex}
  .watermark span{
    font-size:64pt;font-weight:800;color:rgba(24,90,189,.10);transform:rotate(-30deg);
    white-space:nowrap;letter-spacing:4px;text-transform:uppercase;
  }
  .page-border{position:absolute;inset:10px;border:2px solid #b9c0ca;pointer-events:none;display:none;z-index:0;border-radius:2px}
  .page-border.show{display:block}
  .page-border.style-shadow{box-shadow:4px 4px 0 rgba(0,0,0,.12)}
  .page-border.style-double{border:4px double #b9c0ca}

  .canvas.gridlines .paper{
    background-image:linear-gradient(rgba(24,90,189,.09) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(24,90,189,.09) 1px,transparent 1px);
    background-size:24px 24px;
  }
  .canvas.guides .paper{outline:1px dashed rgba(24,90,189,.45);outline-offset:0}

  /* ================= Status bar ================= */
  .statusbar{
    flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:4px 12px;
    background:var(--panel);border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);
    z-index:20;
  }
  .statusbar .grow{flex:1}
  .statusbar .stat{cursor:pointer;padding:2px 5px;border-radius:4px;white-space:nowrap}
  .statusbar .stat:hover{background:var(--panel-2);color:var(--text)}
  .chip{background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:2px 9px;font-size:11px}
  .viewbtns{display:flex;gap:1px}
  .vbtn{background:none;border:1px solid transparent;border-radius:4px;width:26px;height:22px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
  .vbtn:hover{background:var(--panel-2)}
  .vbtn.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-line)}
  .vbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
  .zoom{display:flex;align-items:center;gap:5px}
  .zoom input[type=range]{width:96px;accent-color:var(--accent)}
  .mini{
    background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:2px 8px;
    cursor:pointer;color:var(--text);font-size:11.5px;
  }
  .mini:hover{background:var(--panel-2);border-color:var(--accent-line)}
  .mini.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .mini.primary:hover{background:var(--accent-2)}
  .mini.danger{color:#b3261e;border-color:#e6b4b0}
  .hidden{display:none !important}

  /* ================= Backstage ================= */
  #backstage{
    position:fixed;inset:38px 0 0 0;background:var(--panel);z-index:80;display:flex;
  }
  #backstage.hidden{display:none}
  .bs-menu{width:220px;flex:0 0 auto;background:var(--accent);padding:12px 0;color:#fff}
  html[data-theme="dark"] .bs-menu{background:#16222f}
  .bs-menu button{
    display:block;width:100%;text-align:left;background:none;border:0;color:#fff;
    padding:9px 20px;font-size:13px;cursor:pointer;border-left:3px solid transparent;
  }
  .bs-menu button:hover{background:rgba(255,255,255,.12)}
  .bs-menu button.on{background:rgba(255,255,255,.18);border-left-color:#fff;font-weight:600}
  .bs-menu .bs-close{margin-top:18px;border-top:1px solid rgba(255,255,255,.2);padding-top:14px}
  .bs-body{flex:1;overflow:auto;padding:26px 34px;max-width:900px}
  .bs-body h2{margin:0 0 4px;font-size:22px;font-weight:600}
  .bs-body .sub{color:var(--muted);margin:0 0 20px;font-size:13px}
  .bs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .tpl{
    border:1px solid var(--border);border-radius:8px;background:var(--panel-2);cursor:pointer;
    padding:10px;text-align:left;
  }
  .tpl:hover{border-color:var(--accent);box-shadow:0 3px 12px rgba(0,0,0,.08)}
  .tpl .thumb{height:78px;border:1px solid var(--border-soft);border-radius:4px;background:#fff;margin-bottom:8px;padding:8px;overflow:hidden}
  .tpl .thumb i{display:block;height:4px;background:#dbe1ea;border-radius:2px;margin-bottom:4px}
  .tpl .thumb i.t{height:7px;width:60%;background:#b9c8dd}
  .tpl b{font-size:12.5px;display:block}
  .tpl span{font-size:11px;color:var(--muted)}
  .bs-row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:18px}
  .bs-card{flex:1 1 260px;border:1px solid var(--border);border-radius:8px;padding:14px}
  .bs-card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .bs-card .kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:12.5px}
  .bs-card .kv b{font-weight:600}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
  .field label{font-size:11.5px;color:var(--muted)}
  .field input,.field select,.field textarea{
    border:1px solid var(--border);border-radius:5px;padding:6px 8px;background:var(--panel-2);
    outline:none;font-size:12.5px;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:var(--panel)}
  .doclist{display:flex;flex-direction:column;gap:8px}
  .docrow{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:7px;padding:9px 12px;cursor:pointer}
  .docrow:hover{border-color:var(--accent);background:var(--panel-2)}
  .docrow .nm{flex:1;font-size:12.5px;font-weight:600}
  .docrow .dt{font-size:11px;color:var(--muted)}

  /* ================= Floating UI ================= */
  .floatbar{
    position:fixed;z-index:60;display:none;align-items:center;gap:3px;
    background:var(--panel);border:1px solid var(--border);border-radius:7px;
    padding:4px 5px;box-shadow:0 8px 24px rgba(0,0,0,.18);flex-wrap:wrap;max-width:calc(100vw - 20px);
  }
  .floatbar.show{display:flex}
  #miniBar{padding:3px 4px}
  #miniBar .mini{border-color:transparent;padding:3px 7px}
  #miniBar .mini:hover{border-color:var(--border)}
  #ctxMenu{
    position:fixed;z-index:90;display:none;min-width:210px;background:var(--panel);
    border:1px solid var(--border);border-radius:8px;box-shadow:0 14px 34px rgba(0,0,0,.22);padding:4px;
  }
  #ctxMenu.show{display:block}
  #ctxMenu button{
    display:flex;width:100%;align-items:center;gap:8px;background:none;border:0;padding:6px 10px;
    border-radius:5px;font-size:12.5px;cursor:pointer;text-align:left;color:var(--text);
  }
  #ctxMenu button:hover{background:var(--accent-soft)}
  #ctxMenu button .sc{margin-left:auto;color:var(--muted);font-size:11px}
  #ctxMenu hr{border:0;border-top:1px solid var(--border-soft);margin:4px 6px}
  #popover{
    position:fixed;z-index:95;display:none;background:var(--panel);border:1px solid var(--border);
    border-radius:8px;box-shadow:0 14px 34px rgba(0,0,0,.2);padding:8px;
  }
  #popover.show{display:block}
  .pop-title{font-size:11px;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.3px}
  .pop-grid{display:grid;gap:1px}
  .pop-cell{width:16px;height:16px;border:1px solid var(--border);background:var(--panel-2);cursor:pointer}
  .pop-cell:hover,.pop-cell.hot{background:var(--accent);border-color:var(--accent)}
  .pop-list{display:flex;flex-direction:column;gap:1px;min-width:190px}
  .pop-list button{
    display:flex;align-items:center;gap:8px;background:none;border:0;text-align:left;
    padding:6px 8px;border-radius:5px;font-size:12.5px;cursor:pointer;color:var(--text);
  }
  .pop-list button:hover{background:var(--accent-soft)}
  .pop-list .sw{width:22px;height:14px;border-radius:3px;border:1px solid var(--border)}
  .pop-sep{height:1px;background:var(--border-soft);margin:4px 0}

  /* ================= Find panel ================= */
  #findBar{
    position:fixed;right:14px;z-index:75;width:330px;background:var(--panel);border:1px solid var(--border);
    border-radius:9px;box-shadow:0 14px 34px rgba(0,0,0,.2);padding:10px;display:none;
  }
  #findBar.show{display:block}
  #findBar .row{display:flex;gap:5px;align-items:center;margin-bottom:6px}
  #findBar .row:last-child{margin-bottom:0}
  #findBar input[type=text]{
    flex:1;min-width:0;height:28px;border:1px solid var(--border);border-radius:5px;padding:0 7px;
    background:var(--panel-2);outline:none;font-size:12.5px;
  }
  #findBar input[type=text]:focus{border-color:var(--accent);background:var(--panel)}
  #findBar .count{font-size:11px;color:var(--muted);min-width:46px;text-align:right}
  #findBar label.chk{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);cursor:pointer}

  /* ================= Dialog ================= */
  dialog{
    border:1px solid var(--border);border-radius:10px;background:var(--panel);color:var(--text);
    padding:0;width:min(560px,calc(100% - 32px));box-shadow:0 24px 60px rgba(0,0,0,.3);
  }
  dialog::backdrop{background:rgba(10,14,20,.42)}
  .dlg-head{padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
  .dlg-body{padding:14px 16px;max-height:64vh;overflow:auto;font-size:12.5px}
  .dlg-body p{margin:0 0 10px}
  .dlg-foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
  .dlg-body table{width:100%;border-collapse:collapse}
  .dlg-body td{padding:4px 2px;border-bottom:1px solid var(--border-soft)}
  .dlg-body kbd{background:var(--panel-2);border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px}
  .dlg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .dlg-note{color:var(--muted);font-size:11.5px;margin:6px 0 0}

  /* ================= Modes ================= */
  body.focusmode .tabs,body.focusmode #ribbon,body.focusmode .ruler-row,body.focusmode .sidepane,
  body.focusmode .titlebar,body.focusmode .statusbar{display:none !important}
  body.focusmode #app{height:100vh}
  body.focusmode .canvas{padding-top:40px}
  body.readmode .tabs,body.readmode #ribbon,body.readmode .ruler-row{display:none !important}
  body.readmode .paper{font-size:13pt;line-height:1.7}
  body.readmode .canvas{background:var(--panel-2)}
  html[data-view="web"] .page{width:100%;min-height:0;box-shadow:none;padding:0 24px;background:transparent}
  html[data-view="web"] .paper{max-width:900px;margin:0 auto;background:var(--paper);padding:20px;box-shadow:var(--shadow)}
  html[data-view="web"] .ruler-row{display:none !important}
  html[data-view="web"] .hf{display:none}
  html[data-view="web"] .watermark,html[data-view="web"] .page-border{display:none !important}

  @media (max-width:1100px){
    .sidepane{width:210px}
    .tb-search{display:none}
  }
  @media (max-width:860px){
    .rb .lbl{display:none}
    .rb.big{min-width:42px;height:44px}
    .tb-share span{display:none}
    .doc-title input{font-size:12px}
    .sidepane{position:absolute;z-index:50;height:100%;box-shadow:0 0 30px rgba(0,0,0,.2)}
  }

  /* ================= Print ================= */
  @media print{
    @page{size:A4;margin:2.4cm 2cm}
    html,body{height:auto;overflow:visible;background:#fff}
    .titlebar,.tabs,#ribbon,.statusbar,#findBar,.floatbar,#ctxMenu,#popover,.sidepane,
    dialog,.ruler-row,#backstage,#miniBar,.pagebreak::after,.colbreak::after{display:none !important}
    #app{display:block;height:auto}
    .workspace{display:block}
    .canvas{padding:0;overflow:visible;background:#fff}
    .page{
      width:auto !important;min-height:0 !important;margin:0 !important;padding:0 !important;
      box-shadow:none !important;zoom:1 !important;border-radius:0;display:block;
      height:auto !important;background:none !important;
    }
    .sheets{display:none !important}
    .paper [data-pgm]{margin-top:0 !important}
    .paper{
      zoom:1 !important;outline:none !important;font-size:11pt;min-height:0;
      width:auto;padding:0;box-shadow:none;background:#fff;
    }
    .hf{display:block !important;border:0 !important}
    .hf-top{position:fixed;top:-1.6cm;left:0;right:0;font-size:8.5pt;color:#555}
    .hf-bottom{position:fixed;bottom:-1.6cm;left:0;right:0;font-size:8.5pt;color:#555;margin:0}
    .hf:empty{display:none !important}
    .watermark{position:fixed;inset:0;display:flex !important}
    .watermark span{font-size:80pt;color:rgba(0,0,0,.06) !important}
    .page-border{display:none !important}
    .paper .pagebreak{border:0;break-after:page;page-break-after:always;margin:0;height:0}
    .paper .colbreak{display:none}
    .paper ins.trk{color:inherit;background:none;text-decoration:underline}
    .paper del.trk{color:#b3261e;background:none}
    .paper pre,.paper blockquote,.paper th,.paper .tbox,.paper .st-intense{
      -webkit-print-color-adjust:exact;print-color-adjust:exact;
    }
    .paper .cmt-hl{background:none;border:0}
  }
</style>
</head>

   CORE — helpers, icons, ribbon, commands, persistence, page setup

const I = {

  shrink: S('<path d="M4 18 10 6l6 12"/><path d="M6.5 14h7"/><path d="M15 12h6"/>'),
  color: '<span class="tx">A</span><span class="bar" style="background:#c0392b"></span>',

function loadSettings(){

    const s = JSON.parse(localStorage.getItem('wordweb.settings') || 'null');
    if(s) settings = Object.assign({}, DEFAULTS, s);
  }catch(e){}

}

/* ------------------------------ Toast -------------------------------- */
let toastEl = null, toastTimer = null;
function toast(msg){
  if(!toastEl){
    toastEl = document.createElement('div');
    toastEl.style.cssText = 'position:fixed;left:50%;bottom:52px;transform:translateX(-50%);background:#20242a;color:#fff;'
      + 'padding:8px 16px;border-radius:18px;font-size:12.5px;z-index:300;box-shadow:0 10px 26px rgba(0,0,0,.3);'
      + 'opacity:0;transition:opacity .18s, transform .18s;pointer-events:none;max-width:80vw';
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = msg;
  toastEl.style.opacity = '1';
  toastEl.style.transform = 'translateX(-50%) translateY(-4px)';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toastEl.style.opacity = '0';
    toastEl.style.transform = 'translateX(-50%)';
  }, 2200);
}

/* ------------------------------ Dialog ------------------------------- */
const dlg = $('#dlg');
function openDialog(opt){
  $('#dlgTitle').textContent = opt.title || '';
  $('#dlgBody').innerHTML = opt.body || '';
  const foot = $('#dlgFoot');
  foot.innerHTML = '';
  const cancel = document.createElement('button');
  cancel.className = 'mini';
  cancel.textContent = opt.cancelText || 'Batal';
  cancel.onclick = () => { dlg.close(); if(opt.onCancel) opt.onCancel(); };
  foot.appendChild(cancel);
  if(opt.okText !== false){
    const ok = document.createElement('button');
    ok.className = 'mini primary';
    ok.textContent = opt.okText || 'OK';
    ok.onclick = () => {
      let res;
      try{ res = opt.onOk ? opt.onOk($('#dlgBody')) : undefined; }
      catch(err){ console.error(err); toast('Gagal: ' + err.message); return; }
      if(res === false) return;
      dlg.close();
      // DOM outside a modal dialog is inert: run insertions after it closes
      if(typeof res === 'function') setTimeout(res, 0);
    };
    foot.appendChild(ok);
  }
  if(opt.hideCancel) cancel.remove();
  dlg.showModal();
  const first = $('#dlgBody input, #dlgBody select, #dlgBody textarea');
  if(first) setTimeout(() => first.focus(), 30);
  if(opt.onOpen) opt.onOpen($('#dlgBody'));
  return $('#dlgBody');
}
$('#dlgX').onclick = () => dlg.close();
function ask(title, label, value){
  return new Promise(res => {
    openDialog({
      title, body: '<div class="field"><label>' + esc(label) + '</label><input id="askInput" value="' + esc(value || '') + '"></div>',
      onOk: () => { res($('#askInput').value); },
      onCancel: () => res(null)
    });
    setTimeout(() => { const i = $('#askInput'); if(i){ i.focus(); i.select(); } }, 40);
  });
}
function confirmDlg(title, msg, okText){
  return new Promise(res => {
    openDialog({
      title, body: '<p>' + msg + '</p>', okText: okText || 'Lanjutkan',
      onOk: () => res(true), onCancel: () => res(false)
    });
  });
}

/* ------------------------------ Popover ------------------------------ */
const popover = $('#popover');
let popAnchors = [];
function openPopover(anchor, html, opts){
  opts = opts || {};
  popover.innerHTML = html;
  popover.classList.add('show');
  const r = anchor.getBoundingClientRect();
  popover.style.minWidth = (opts.width || 0) + 'px';
  const pr = popover.getBoundingClientRect();
  let left = r.left;
  let top = r.bottom + 4;
  if(left + pr.width > window.innerWidth - 8) left = window.innerWidth - pr.width - 8;
  if(top + pr.height > window.innerHeight - 8) top = Math.max(8, r.top - pr.height - 4);
  popover.style.left = Math.max(8, left) + 'px';
  popover.style.top = Math.max(8, top) + 'px';
  popAnchors = [anchor];
  if(opts.onOpen) opts.onOpen(popover);
  return popover;
}
function closePopover(){ popover.classList.remove('show'); popover.innerHTML = ''; }
document.addEventListener('mousedown', e => {
  if(popover.classList.contains('show') && !popover.contains(e.target) && !popAnchors.some(a => a.contains(e.target))) closePopover();
}, true);

/* ---------------------------- Ribbon build --------------------------- */
function btn(o){
  const cls = 'rb' + (o.big ? ' big' : '') + (o.split ? ' split' : '') + (o.wide ? ' wide' : '');
  const a = [];
  if(o.cmd) a.push('data-cmd="' + o.cmd + '"' + (o.val !== undefined ? ' data-val="' + o.val + '"' : ''));
  if(o.action) a.push('data-action="' + o.action + '"');
  if(o.title) a.push('title="' + esc(o.title) + '"');
  const caret = o.split ? '<svg class="caret" viewBox="0 0 24 24" style="position:absolute;right:1px;bottom:1px;width:8px;height:8px"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="3"/></svg>' : '';
  return '<button type="button" class="' + cls + '" ' + a.join(' ') + '>'
    + '<span class="ico">' + (I[o.icon] || o.icon || '') + '</span>'
    + (o.label ? '<span class="lbl">' + esc(o.label) + '</span>' : '')
    + caret + '</button>';
}
function sel(o){
  return '<select class="rsel" id="' + o.id + '" title="' + esc(o.title || '') + '" style="width:' + (o.w || 100) + 'px">'
    + o.opts.map(p => '<option value="' + esc(p[0]) + '">' + esc(p[1]) + '</option>').join('')
    + '</select>';
}
function colorBtn(o){
  return '<label class="rb color" title="' + esc(o.title || '') + '">'
    + '<span class="ico">' + I[o.icon] + '</span>'
    + '<input type="color" id="' + o.id + '" value="' + o.value + '"></label>';
}
function group(label, items){
  return '<div class="group"><div class="gitems">' + items.join('') + '</div><div class="glabel">' + esc(label) + '</div></div>';
}
function pane(id, groups, cls){
  return '<div class="ribbon-pane' + (cls ? ' ' + cls : '') + '" data-pane="' + id + '">' + groups.join('') + '</div>';
}

      : s.id === 'subtitle' ? 'font-size:11px;color:#6b7280'

      + '<b style="' + preview + '">' + s.name + '</b><i>Gaya</i></button>';

}

/* ------------------------------- Tabs -------------------------------- */
function switchTab(name){
  if(name === 'file'){ openBackstage(); return; }
  closeBackstage();
  $$('#tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  $$('.ribbon-pane').forEach(p => p.classList.toggle('active', p.dataset.pane === name));
  $$('#ribbon .rsel').forEach(s => { if(s.id === 'margin' || s.id === 'pageSize') syncPageSelects(); });
}
$$('#tabs .tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));

/* --------------------------- Selection state -------------------------- */
let savedRange = null;
let pendingSize = 11;

function saveSel(){
  const s = getSelection();
  if(s.rangeCount && editor.contains(s.anchorNode)) savedRange = s.getRangeAt(0).cloneRange();
}
function restoreSel(){
  const s = getSelection();
  if(!s.rangeCount || !editor.contains(s.anchorNode)){
    if(savedRange){ try{ s.removeAllRanges(); s.addRange(savedRange); }catch(e){} }
  }
  editor.focus();
}
function exec(cmd, val){
  restoreSel();
  try{ document.execCommand(cmd, false, val === undefined ? null : val); }catch(e){ console.warn(cmd, e); }
  afterChange();
}
function closestBlock(node){
  if(!node) return null;
  if(node.nodeType === 3) node = node.parentNode;
  if(!node || !node.closest) return null;
  const b = node.closest('p,h1,h2,h3,h4,h5,h6,li,blockquote,pre,td,th,div');
  return b && b !== editor ? b : null;
}
function blocksInSelection(){
  const s = getSelection();
  if(!s.rangeCount) return [];
  const r = s.getRangeAt(0);
  if(r.collapsed){
    const b = closestBlock(r.startContainer);
    return b ? [b] : [];
  }
  return $$('p,h1,h2,h3,h4,h5,h6,li,blockquote,pre,td,th', editor)
    .filter(el => { try{ return r.intersectsNode(el); }catch(e){ return false; } })
    .filter(el => !el.querySelector('p,h1,h2,h3,h4,h5,h6,blockquote,pre'));
}
function inEditor(){
  const s = getSelection();
  return s.rangeCount && editor.contains(s.anchorNode);
}

/* --------------------------- Font size fix ---------------------------- */
function convertFontTags(){
  const px = (pendingSize || 11) + 'px';
  $$('font[size]', editor).forEach(f => {
    const span = document.createElement('span');
    span.style.fontSize = px;
    while(f.firstChild) span.appendChild(f.firstChild);
    f.replaceWith(span);
  });
  $$('span[style], font[style]', editor).forEach(sp => {
    const v = (sp.style.fontSize || '').trim();
    if(v && !/px|pt|em|rem|%|calc/i.test(v)) sp.style.fontSize = px;
  });
}
function setFontSize(px){
  pendingSize = parseFloat(px) || 11;
  restoreSel();
  try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
  try{ document.execCommand('fontSize', false, '7'); }catch(e){}
  try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
  convertFontTags();
  afterChange();
}

/* ---------------------------- Toolbar sync ---------------------------- */
function updateToolbar(){
  ['bold','italic','underline','strikeThrough','subscript','superscript',
   'insertUnorderedList','insertOrderedList','justifyLeft','justifyCenter','justifyRight','justifyFull'
  ].forEach(c => {
    const b = ribbon.querySelector('[data-cmd="' + c + '"]');
    if(!b) return;
    let on = false;
    try{ on = document.queryCommandState(c); }catch(e){}
    b.classList.toggle('on', !!on);
  });

  const block = closestBlock(getSelection().anchorNode);
  const fs = $('#fontSize');
  if(fs && block){
    const pt = Math.round(parseFloat(getComputedStyle(block).fontSize) * 0.75 * 2) / 2;
    for(let i = 0; i < fs.options.length; i++){
      if(parseFloat(fs.options[i].value) === pt){ fs.value = String(pt); break; }
    }
  }
  const fn = $('#fontName');
  if(fn && block){
    const fam = (getComputedStyle(block).fontFamily || '').split(',')[0].replace(/["']/g, '').trim();
    const hit = FONTS.filter(f => f.toLowerCase() === fam.toLowerCase())[0];
    if(hit) fn.value = hit;
  }
  if(block){
    $$('.stylecard').forEach(c => c.classList.remove('on'));
    const active = STYLES.find(s => s.tag === block.tagName.toLowerCase() && (!s.cls || block.classList.contains(s.cls)));
    if(active) $$('.stylecard[data-style="' + active.id + '"]').forEach(c => c.classList.add('on'));
  }
  updateTableBar();
  updateObjBar();
}

/* --------------------------- Change pipeline -------------------------- */
function afterChange(){
  updateStats();
  updateToolbar();
  refreshNav();
  refreshFootnotes();
  markDirty();
  queueSave();
  schedulePaginate();
}
function updateStats(){
  const text = editor.innerText || '';
  const words = text.trim() ? text.trim().split(/\s+/).filter(Boolean).length : 0;
  statusEls.words.textContent = words.toLocaleString('id-ID') + ' kata';
  updatePageStatus();
  statusEls.lang.textContent = editor.getAttribute('lang') === 'en' ? 'English (US)' : 'Bahasa Indonesia';
  const r = $('#zoomLabel');
  if(r) r.textContent = zoom + '%';
  statusEls.track.classList.toggle('hidden', !trackOn);
}
function pageCount(){
  if(pgActive() && pgTotal) return pgTotal;
  return pageCountEstimate();
}
function pageCountEstimate(){
  const csP = getComputedStyle(pageEl);
  const ph = parseFloat(csP.minHeight) || 1123;
  const padT = parseFloat(csP.paddingTop) || 0;
  const padB = parseFloat(csP.paddingBottom) || 0;
  const hfH = (docHeader.offsetHeight || 0) + (docFooter.offsetHeight || 0);
  const usable = Math.max(240, ph - padT - padB - hfH);
  const content = editor.scrollHeight;
  if(content <= usable + 2) return 1;
  return Math.ceil(content / usable);
}

/* ------------------------------ Zoom --------------------------------- */
let zoom = 100;
function setZoom(v){
  zoom = Math.max(50, Math.min(200, Math.round(v)));
  pageEl.style.zoom = zoom / 100;
  $('#zoomRange').value = zoom;
  $('#zoomLabel').textContent = zoom + '%';
}
$('#zoomRange').addEventListener('input', e => setZoom(parseInt(e.target.value, 10)));

/* ------------------------------ Views -------------------------------- */
function setView(v){
  document.documentElement.dataset.view = v;
  document.body.classList.toggle('readmode', v === 'read');
  if(v !== 'read') document.body.classList.remove('focusmode');
  $$('.vbtn').forEach(b => {
    const a = b.dataset.action;
    b.classList.toggle('on', (v === 'print' && a === 'viewPrint') || (v === 'web' && a === 'viewWeb') || (v === 'read' && a === 'viewRead'));
  });
  if(v === 'read'){ closeRibbonPanes(); }
  setTimeout(() => {
    updateStats(); drawRuler();
    if(v === 'print') paginate(); else clearPagination();
    updatePageStatus();
  }, 60);
}

/* --------------------------- Page setup ------------------------------ */
const PAGE_SIZES = { a4:['21cm','29.7cm'], letter:['21.59cm','27.94cm'], legal:['21.59cm','35.56cm'], a5:['14.8cm','21cm'] };
const MARGINS = {
  normal:{x:'2.2cm', y:'2cm'}, narrow:{x:'1.27cm', y:'1.27cm'}, moderate:{x:'1.9cm', y:'2.54cm'},
  wide:{x:'3.5cm', y:'2.54cm'}, mirror:{x:'2.2cm', y:'2cm'}
};
function applyPageSetup(){
  const root = document.documentElement.style;
  root.setProperty('--page-w', pageSetup.w);
  root.setProperty('--page-h', pageSetup.h);
  root.setProperty('--pad-x', pageSetup.padX);
  root.setProperty('--pad-y', pageSetup.padY);
  editor.style.columnCount = pageSetup.columns > 1 ? pageSetup.columns : '';
  editor.style.columnGap = pageSetup.columns > 1 ? '1.4cm' : '';
  editor.style.columnRule = (pageSetup.columns > 1 && pageSetup.lineBetween) ? '1px solid #d5dae2' : '';
  editor.style.hyphens = pageSetup.hyphen ? 'auto' : 'manual';
  editor.classList.toggle('linenums', !!pageSetup.lineNumbers);
  syncPageSelects();
  drawRuler();
  if(pgActive()) paginate(); else clearPagination();
  // transisi lebar halaman (0,15 s) membuat ukuran teks berubah setelah
  // paginasi pertama; ulangi sekali lagi agar jumlah halaman akurat.
  clearTimeout(pgSetupTimer);
  pgSetupTimer = setTimeout(() => { if(pgActive()) paginate(); }, 260);
}
function syncPageSelects(){
  const m = $('#margin'); if(m) m.value = pageSetup.marginPreset || 'normal';
  const s = $('#pageSize'); if(s && PAGE_SIZES[pageSetup.size]) s.value = pageSetup.size;

/* ============================ Pagination =============================
   Tampilan berhalaman: setiap halaman digambar sebagai lembar A4 terpisah.
   Blok yang melewati batas halaman didorong ke halaman berikutnya lewat
   margin-top sementara (ditandai data-pgm) yang dibersihkan saat simpan,
   ekspor, dan cetak.
   ===================================================================== */
const PG_GAP = 26;                       // jarak antar lembar (px, tanpa zoom)
let pgTotal = 1, pgCur = 1, pgTimer = null, pgBusy = false, pgM = null, pgSetupTimer = null;

function pgActive(){
  return document.documentElement.dataset.view === 'print';
}
function pxOf(len){
  const d = document.createElement('div');
  d.style.cssText = 'position:absolute;visibility:hidden;top:0;left:-9999px;height:' + len;
  document.body.appendChild(d);
  const v = d.offsetHeight;
  d.remove();
  return v || 0;
}
function pgMetrics(){
  const pageH = pxOf(pageSetup.h) || 1123;
  const padY  = pxOf(pageSetup.padY) || 76;
  const padX  = pxOf(pageSetup.padX) || 83;
  const padT  = padY * 0.55;
  const hH = docHeader.classList.contains('off') ? 0 : docHeader.offsetHeight;
  const fH = docFooter.classList.contains('off') ? 0 : docFooter.offsetHeight;
  return { pageH, padT, padX, hH, fH, gap:PG_GAP, usable:Math.max(140, pageH - padT * 2 - hH - fH) };
}
function resetPgBlock(b){
  if(!b.hasAttribute('data-pgm')) return;
  const orig = b.getAttribute('data-pgm');
  if(orig) b.style.marginTop = orig; else b.style.removeProperty('margin-top');
  b.removeAttribute('data-pgm');
  if(!b.getAttribute('style')) b.removeAttribute('style');
}
function clearPagination(){
  Array.from(editor.children).forEach(resetPgBlock);
  pageEl.classList.remove('paginated');
  pageEl.style.height = '';
  const sh = $('#sheets');
  if(sh) sh.innerHTML = '';
  pgTotal = 1;
}
function pushPg(b, delta){
  if(delta <= 0.6) return;
  if(!b.hasAttribute('data-pgm')) b.setAttribute('data-pgm', b.style.marginTop || '');
  for(let i = 0; i < 3 && delta > 0.6; i++){
    const before = b.offsetTop;
    const mt = parseFloat(getComputedStyle(b).marginTop) || 0;
    b.style.marginTop = (mt + delta) + 'px';
    delta -= b.offsetTop - before;
  }
}
function paginate(){
  if(pgBusy) return;
  if(!pgActive()){ clearPagination(); updatePageStatus(); return; }
  pgBusy = true;
  try{
    const m = pgMetrics();
    pgM = m;
    const blocks = Array.from(editor.children);
    blocks.forEach(resetPgBlock);
    pageEl.classList.add('paginated');
    const span = m.pageH + m.gap;
    let forceBreak = false;

    blocks.forEach(b => {
      if(b.classList.contains('pagebreak')){ forceBreak = true; return; }
      if(forceBreak){
        forceBreak = false;
        const t0 = b.offsetTop;
        const k0 = Math.floor((t0 + 0.6) / span);
        if(t0 > k0 * span + 1.5) pushPg(b, (k0 + 1) * span - t0);
      }
      const h = b.offsetHeight;
      if(h > m.usable + 0.6) return;             // blok lebih tinggi dari halaman: dibiarkan mengalir
      const top = b.offsetTop;
      const k = Math.floor((top + 0.6) / span);
      if(top + h > k * span + m.usable + 0.6) pushPg(b, (k + 1) * span - top);
    });

    let pages = 1;
    blocks.forEach(b => {
      const end = b.offsetTop + b.offsetHeight;
      pages = Math.max(pages, Math.floor((end - 0.5) / span) + 1);
    });
    pages = Math.max(1, pages);
    pgTotal = pages;
    pageEl.style.height = ((pages - 1) * span + m.pageH) + 'px';
    renderSheets(pages, m);
    syncPageFields(pages);
    updatePageStatus();
  } finally {
    pgBusy = false;
  }
}
function schedulePaginate(){
  clearTimeout(pgTimer);
  pgTimer = setTimeout(paginate, 140);
}
function numify(html, n){
  if(html.indexOf('pgfield') === -1) return html;
  const d = document.createElement('div');
  d.innerHTML = html;
  d.querySelectorAll('.pgfield').forEach(f => {
    f.textContent = (f.getAttribute('data-pg') === 'plain' ? '' : 'Halaman ') + n;
  });
  return d.innerHTML;
}
function renderSheets(pages, m){
  const wrap = $('#sheets');
  if(!wrap) return;
  const hHtml = docHeader.classList.contains('off') ? '' : docHeader.innerHTML.trim();
  const fHtml = docFooter.classList.contains('off') ? '' : docFooter.innerHTML.trim();
  const wmEl = $('#watermark');
  const wmOn = wmEl && wmEl.classList.contains('show');
  const wmTxt = ($('#watermarkText') && $('#watermarkText').textContent) || 'DRAF';
  const pbEl = $('#pageBorder');
  const pbOn = pbEl && pbEl.classList.contains('show');
  const pbCls = pbOn ? ((pbEl.className.match(/style-[\w-]+/) || [''])[0]) : '';
  let html = '';
  for(let i = 0; i < pages; i++){
    const n = i + 1;
    let inner = '<span class="sheet-no">' + n + '</span>';
    if(wmOn) inner += '<div class="sheet-wm"><span>' + esc(wmTxt) + '</span></div>';
    if(hHtml && i > 0){
      inner += '<div class="sheet-hf top" style="top:' + m.padT + 'px;height:' + m.hH + 'px;left:' + m.padX + 'px;right:' + m.padX + 'px">'
        + numify(hHtml, n) + '</div>';
    }
    if(fHtml && i < pages - 1){
      inner += '<div class="sheet-hf bot" style="bottom:' + m.padT + 'px;height:' + m.fH + 'px;left:' + m.padX + 'px;right:' + m.padX + 'px">'
        + numify(fHtml, n) + '</div>';
    }
    html += '<div class="sheet' + (pbOn ? ' sheet-pb ' + pbCls : '') + '" style="top:' + (i * (m.pageH + m.gap))
      + 'px;height:' + m.pageH + 'px">' + inner + '</div>';
  }
  wrap.innerHTML = html;
}
function syncPageFields(pages){
  docHeader.querySelectorAll('.pgfield').forEach(f => {
    f.textContent = (f.getAttribute('data-pg') === 'plain' ? '' : 'Halaman ') + 1;
  });
  docFooter.querySelectorAll('.pgfield').forEach(f => {
    f.textContent = (f.getAttribute('data-pg') === 'plain' ? '' : 'Halaman ') + pages;
  });
}
function updatePageStatus(){
  const el = statusEls.page;
  if(!el) return;
  const total = Math.max(1, pgTotal || 1);
  let cur = pgCur || 1;
  const s = getSelection();
  if(s.rangeCount && editor.contains(s.anchorNode)){
    const r = s.getRangeAt(0).cloneRange();
    r.collapse(true);
    const rect = r.getBoundingClientRect();
    if(rect && (rect.height || rect.width || rect.top)){
      const er = editor.getBoundingClientRect();
      const z = (zoom || 100) / 100;
      const m = pgM || pgMetrics();
      const y = (rect.top - er.top) / z;
      cur = Math.floor((y + 1) / (m.pageH + m.gap)) + 1;
    }
  }
  pgCur = Math.max(1, Math.min(total, cur));
  el.textContent = 'Halaman ' + pgCur + ' dari ' + total;
}
document.addEventListener('selectionchange', () => {
  if(!pgActive()) return;
  if(updatePageStatus._t) return;
  updatePageStatus._t = setTimeout(() => { updatePageStatus._t = null; updatePageStatus(); }, 80);
});
window.addEventListener('resize', () => { if(pgActive()) schedulePaginate(); });
window.addEventListener('beforeprint', clearPagination);
window.addEventListener('afterprint', () => { if(pgActive()) paginate(); });
[docHeader, docFooter].forEach(el => {
  el.addEventListener('input', () => { schedulePaginate(); markDirty(); queueSave(); });
});
window.addEventListener('load', () => { if(pgActive()) schedulePaginate(); });
pageEl.addEventListener('transitionend', e => { if(e.propertyName === 'width' && pgActive()) paginate(); });
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(() => { if(pgActive()) schedulePaginate(); });
}


/* ------------------------------- Ruler ------------------------------- */
function drawRuler(){
  const ruler = $('#ruler');
  if(!ruler) return;
  const w = pageEl.getBoundingClientRect().width;
  const cm = 96 / 2.54;
  const total = Math.round(w / cm);
  let html = '';
  const padX = parseFloat(getComputedStyle(pageEl).paddingLeft) || 0;
  html += '<div class="margin-band" style="left:0;width:' + padX + 'px"></div>';
  html += '<div class="margin-band" style="right:0;left:auto;width:' + padX + 'px"></div>';
  for(let i = 0; i <= total; i++){
    const x = i * cm;
    if(x > w) break;
    const major = i % 1 === 0;
    html += '<div class="tick' + (major ? ' major' : '') + '" style="left:' + x + 'px"></div>';
    if(i % 2 === 0 && i > 0) html += '<div class="num" style="left:' + x + 'px">' + i + '</div>';
  }
  ruler.innerHTML = html;
}

function refreshNav(){

/* Bersihkan dorongan margin hasil paginasi sebelum disimpan/diekspor. */
function cleanHtml(){
  if(!editor.querySelector('[data-pgm]')) return editor.innerHTML;
  const clone = editor.cloneNode(true);
  clone.querySelectorAll('[data-pgm]').forEach(el => {
    const orig = el.getAttribute('data-pgm');
    if(orig) el.style.marginTop = orig; else el.style.removeProperty('margin-top');
    el.removeAttribute('data-pgm');
    if(!el.getAttribute('style')) el.removeAttribute('style');
  });
  return clone.innerHTML;
}
function docPayload(){
  return {
    id: docId,
    name: $('#docName').value || 'Dokumen',
    html: cleanHtml(),
    header: docHeader.innerHTML,
    footer: docFooter.innerHTML,
    hfOn: { h: !docHeader.classList.contains('off'), f: !docFooter.classList.contains('off') },
    page: pageSetup,
    updated: Date.now()
  };
}
function saveLocal(silent){
  try{
    const p = docPayload();
    localStorage.setItem('wordweb.doc', JSON.stringify(p));
    const lib = JSON.parse(localStorage.getItem('wordweb.docs') || '[]');
    const i = lib.findIndex(d => d.id === p.id);
    const rec = { id:p.id, name:p.name, updated:p.updated, html:p.html, header:p.header, footer:p.footer, hfOn:p.hfOn, page:p.page };
    if(i >= 0) lib[i] = rec; else lib.unshift(rec);
    localStorage.setItem('wordweb.docs', JSON.stringify(lib.slice(0, 20)));
    dirty = false;
    $('#saveState').textContent = silent ? 'Tersimpan otomatis' : 'Tersimpan';
  }catch(e){
    $('#saveState').textContent = 'Penyimpanan tidak tersedia';
  }
}

  docFooter.innerHTML = rec.footer || '';

  if(rec.hfOn){
    docHeader.classList.toggle('off', !rec.hfOn.h);

  if(rec.page){ pageSetup = Object.assign({}, pageSetup, rec.page); applyPageSetup(); }

  afterChange(); saveLocal(false);
}

/* ---------------------------- Paste guard ---------------------------- */
const ALLOWED = ['P','DIV','BR','SPAN','B','STRONG','I','EM','U','S','STRIKE','SUB','SUP','H1','H2','H3','H4','H5','H6',
  'UL','OL','LI','BLOCKQUOTE','PRE','CODE','TABLE','THEAD','TBODY','TFOOT','TR','TD','TH','IMG','A','HR','FONT','INS','DEL','SUP','MARK'];
const KEEP_STYLE = ['color','background-color','font-size','font-family','font-weight','font-style','text-decoration',
  'text-align','line-height','width','height','margin','float','display','border-collapse','padding','border','vertical-align'];
function sanitize(html){
  const doc = new DOMParser().parseFromString('<div>' + html + '</div>', 'text/html');
  const root = doc.body.firstChild;
  walkSan(root);
  return root.innerHTML;
}
function walkSan(node){
  Array.from(node.childNodes).forEach(n => {
    if(n.nodeType === 1){
      if(!ALLOWED.includes(n.tagName)){
        const frag = docFragment(n);
        n.replaceWith(frag);
        return;
      }
      if(n.tagName === 'IMG'){
        const src = n.getAttribute('src') || '';
        if(!/^(data:|https?:|blob:)/i.test(src)){ n.remove(); return; }
      }
      if(n.tagName === 'A' && /^javascript:/i.test(n.getAttribute('href') || '')) n.removeAttribute('href');
      Array.from(n.attributes).forEach(a => {
        if(a.name === 'style'){
          const keep = [];
          n.style.cssText.split(';').forEach(pair => {
            const p = pair.split(':');
            if(p.length >= 2){
              const prop = p[0].trim().toLowerCase();
              if(KEEP_STYLE.includes(prop)) keep.push(p[0].trim() + ':' + p.slice(1).join(':').trim());
            }
          });
          if(keep.length) n.setAttribute('style', keep.join(';'));
          else n.removeAttribute('style');
        } else if(!['href','src','colspan','rowspan','alt','class'].includes(a.name)){
          n.removeAttribute(a.name);
        }
      });
      if(n.tagName === 'SPAN' || n.tagName === 'P' || n.tagName === 'DIV'){
        n.className = String(n.className).split(/\s+/).filter(c => c.startsWith('st-') || c === 'caption').join(' ');
      }
      walkSan(n);
    } else if(n.nodeType === 8){
      n.remove();
    }
  });
}
function docFragment(n){
  const frag = document.createDocumentFragment();
  while(n.firstChild) frag.appendChild(n.firstChild);
  return frag;
}
editor.addEventListener('paste', e => {
  if(e.shiftKey) return;
  const html = e.clipboardData && e.clipboardData.getData('text/html');
  if(!html) return;
  e.preventDefault();
  document.execCommand('insertHTML', false, sanitize(html));
  afterChange();
});

const ACTIONS = {};

/* --------------------------- small utilities -------------------------- */
function caretNode(){
  const s = getSelection();
  let n = s.anchorNode;
  if(!n) return null;
  if(n.nodeType === 3) n = n.parentNode;
  return n;
}
function wordRangeAtCaret(){
  const s = getSelection();
  if(!s.rangeCount) return null;
  const r = s.getRangeAt(0);
  if(!r.collapsed) return r;
  const n = r.startContainer;
  if(n.nodeType !== 3) return null;
  const t = n.nodeValue;
  let a = r.startOffset, b = r.startOffset;
  while(a > 0 && /\S/.test(t[a-1])) a--;
  while(b < t.length && /\S/.test(t[b])) b++;
  if(a === b) return null;
  const nr = document.createRange();
  nr.setStart(n, a); nr.setEnd(n, b);
  return nr;
}
function wrapInline(styles, useWord){
  const sel = getSelection();
  if(!sel.rangeCount || !inEditor()) return null;
  let r = sel.getRangeAt(0);
  if(r.collapsed && useWord) r = wordRangeAtCaret() || r;
  if(r.collapsed) return null;
  const span = document.createElement('span');
  Object.assign(span.style, styles);
  try{ r.surroundContents(span); }
  catch(e){ const frag = r.extractContents(); span.appendChild(frag); r.insertNode(span); }
  const nr = document.createRange();
  nr.selectNodeContents(span);
  sel.removeAllRanges(); sel.addRange(nr);
  return span;
}
function toggleInlineStyle(prop, value, offValue){
  const sel = getSelection();
  if(!sel.rangeCount) return;
  const node = caretNode();
  const host = node && node.closest ? node.closest('[style]') : null;
  if(host && editor.contains(host) && host.style[prop] === value){
    host.style[prop] = offValue || '';
    if(!host.getAttribute('style')) host.replaceWith(...host.childNodes);
    afterChange();
    return;
  }
  wrapInline({ [prop]: value }, true);
  afterChange();
}

    if(text) exec('insertText', text);
  }catch(e){
    toast('Tempel: gunakan Ctrl+V di dalam dokumen');
    editor.focus();
  }
};

};

/* --------------------------- Format painter --------------------------- */
let painterStyle = null, painterSticky = false;
ACTIONS.formatPainter = function(){
  const sel = getSelection();
  if(sel.isCollapsed){ toast('Pilih teks dulu untuk menyalin formatnya'); return; }
  const node = caretNode();
  const cs = getComputedStyle(node.nodeType === 3 ? node.parentNode : node);
  painterStyle = {
    fontFamily: cs.fontFamily, fontSize: cs.fontSize, fontWeight: cs.fontWeight,
    fontStyle: cs.fontStyle, color: cs.color, textDecorationLine: cs.textDecorationLine,
    backgroundColor: cs.backgroundColor === 'rgba(0, 0, 0, 0)' ? '' : cs.backgroundColor
  };
  painterSticky = false;
  document.body.style.cursor = 'copy';
  toast('Format disalin — pilih teks tujuan');
};
function applyPainter(){
  if(!painterStyle) return;
  const s = wrapInline(painterStyle, true);
  if(s){
    document.body.style.cursor = '';
    if(!painterSticky) painterStyle = null;
    toast('Format diterapkan');
  }
}
editor.addEventListener('mouseup', () => {
  if(painterStyle){
    const sel = getSelection();
    if(!sel.isCollapsed) applyPainter();
  }
});

function changeCase(kind){
  const sel = getSelection();
  if(!sel.rangeCount || sel.isCollapsed){ toast('Pilih teks yang ingin diubah'); return; }
  const r = sel.getRangeAt(0);
  const frag = r.extractContents();
  const walker = document.createTreeWalker(frag, NodeFilter.SHOW_TEXT);
  let n;
  while((n = walker.nextNode())){
    const t = n.nodeValue;
    if(kind === 'upper') n.nodeValue = t.toUpperCase();
    else if(kind === 'lower') n.nodeValue = t.toLowerCase();
    else if(kind === 'title') n.nodeValue = t.replace(/\S+/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
    else if(kind === 'sentence') n.nodeValue = t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
    else n.nodeValue = (t === t.toUpperCase()) ? t.toLowerCase() : t.toUpperCase();
  }
  const holder = document.createElement('span');
  holder.appendChild(frag);
  r.insertNode(holder);
  const nr = document.createRange();
  nr.selectNodeContents(holder);
  sel.removeAllRanges(); sel.addRange(nr);
  afterChange();
}
ACTIONS.growFont = function(){
  const block = closestBlock(getSelection().anchorNode);
  const cur = block ? parseFloat(getComputedStyle(block).fontSize) : 14.66;
  const next = SIZES.map(s => s * 96 / 72).find(v => v > cur + 0.5) || cur + 4;
  setFontSize(Math.round(next * 0.75 * 2) / 2);
};
ACTIONS.shrinkFont = function(){
  const block = closestBlock(getSelection().anchorNode);
  const cur = block ? parseFloat(getComputedStyle(block).fontSize) : 14.66;
  const arr = SIZES.map(s => s * 96 / 72).filter(v => v < cur - 0.5);
  const prev = arr.length ? arr[arr.length - 1] : Math.max(8, cur - 4);
  setFontSize(Math.round(prev * 0.75 * 2) / 2);
};

const LIST_TYPES = {
  'ul-disc':'disc', 'ul-circle':'circle', 'ul-square':'square',
  'ol-decimal':'decimal', 'ol-alpha':'lower-alpha', 'ol-roman':'upper-roman', 'ol-lower-roman':'lower-roman'
};
function applyList(kind){
  const isUl = kind.indexOf('ul') === 0;
  const n = caretNode();
  let list = n && n.closest ? n.closest('ul,ol') : null;
  if(list && list.tagName === (isUl ? 'UL' : 'OL')){
    list.style.listStyleType = LIST_TYPES[kind];
    afterChange();
    return;
  }
  exec(isUl ? 'insertUnorderedList' : 'insertOrderedList');
  const n2 = caretNode();
  const l2 = n2 && n2.closest ? n2.closest('ul,ol') : null;
  if(l2) l2.style.listStyleType = LIST_TYPES[kind];
  afterChange();
}

function sortBlocks(desc){
  const blocks = blocksInSelection();
  if(blocks.length < 2){ toast('Pilih minimal dua paragraf'); return; }
  const arr = blocks.slice().sort((a, b) => a.innerText.localeCompare(b.innerText, 'id'));
  if(desc) arr.reverse();
  const parent = blocks[0].parentNode;
  const anchor = blocks[0];
  arr.forEach(el => parent.insertBefore(el, anchor));
  afterChange();
  toast('Paragraf diurutkan');
}

  if(!st) return;
  restoreSel();
  try{ document.execCommand('formatBlock', false, '<' + st.tag + '>'); }catch(e){}

/* ------------------------------- Tables ------------------------------- */
function insertTable(rows, cols){
  let html = '<table><thead><tr>';
  for(let i = 1; i <= cols; i++) html += '<th>Header ' + i + '</th>';
  html += '</tr></thead><tbody>';
  for(let r = 1; r < rows; r++){
    html += '<tr>';
    for(let c = 0; c < cols; c++) html += '<td><br></td>';
    html += '</tr>';
  }
  html += '</tbody></table><p><br></p>';
  exec('insertHTML', html);
}

function currentCell(){
  const n = caretNode();
  return n && n.closest ? n.closest('td,th') : null;
}
function updateTableBar(){
  const cell = currentCell();
  const bar = $('#tableBar');
  if(cell && editor.contains(cell)){
    const r = cell.getBoundingClientRect();
    bar.classList.add('show');
    bar.style.left = Math.max(8, Math.min(window.innerWidth - bar.offsetWidth - 10, r.left)) + 'px';
    bar.style.top = (r.top > 140 ? r.top - 40 : r.bottom + 8) + 'px';
  } else bar.classList.remove('show');
}
$('#tableBar').addEventListener('click', e => {
  const b = e.target.closest('[data-table]');
  if(!b) return;
  const cell = currentCell();
  if(!cell) return;
  const row = cell.parentElement, table = cell.closest('table');
  const act = b.dataset.table;
  if(act === 'rowAbove' || act === 'rowBelow'){
    const nr = row.cloneNode(true);
    Array.from(nr.cells).forEach(c => c.innerHTML = '<br>');
    row.parentElement.insertBefore(nr, act === 'rowAbove' ? row : row.nextSibling);
  } else if(act === 'colLeft' || act === 'colRight'){
    const idx = cell.cellIndex, at = act === 'colLeft' ? idx : idx + 1;
    Array.from(table.rows).forEach(tr => {
      const isHead = tr.parentElement.tagName === 'THEAD';
      const c = document.createElement(isHead ? 'th' : 'td');
      c.innerHTML = isHead ? 'Header' : '<br>';
      if(at >= tr.cells.length) tr.appendChild(c); else tr.insertBefore(c, tr.cells[at]);
    });
  } else if(act === 'delRow'){
    if(table.rows.length > 1) row.remove(); else table.remove();
  } else if(act === 'delCol'){
    const idx = cell.cellIndex;
    Array.from(table.rows).forEach(tr => { if(tr.cells[idx]) tr.cells[idx].remove(); });
    if(!table.rows.length || !table.rows[0].cells.length) table.remove();
  } else if(act === 'delTable'){
    table.remove();
  } else if(act === 'merge'){
    const next = cell.nextElementSibling;
    if(next){
      cell.colSpan = (cell.colSpan || 1) + (next.colSpan || 1);
      cell.innerHTML += ' ' + next.innerHTML;
      next.remove();
    }
  } else if(act === 'split'){
    const span = cell.colSpan || 1;
    if(span > 1){
      cell.colSpan = 1;
      let anchor = cell;
      for(let i = 1; i < span; i++){
        const c = document.createElement(cell.tagName.toLowerCase());
        c.innerHTML = '<br>';
        anchor.after(c);
        anchor = c;
      }
    }
  } else if(act === 'header'){
    const firstRow = table.rows[0];
    const thead = table.tHead;
    if(thead){
      const tb = table.tBodies[0] || table.createTBody();
      tb.insertBefore(firstRow, tb.rows[0] || null);
      Array.from(firstRow.cells).forEach(c => {
        const td = document.createElement('td'); td.innerHTML = c.innerHTML; c.replaceWith(td);
      });
    } else {
      const th = table.createTHead();
      th.appendChild(firstRow);
      Array.from(firstRow.cells).forEach(c => {
        const h = document.createElement('th'); h.innerHTML = c.innerHTML; c.replaceWith(h);
      });
    }
  }
  afterChange();
  updateTableBar();
});

/* ------------------------------- Objects ------------------------------ */
let selectedObj = null;
function selectObj(obj){
  if(selectedObj) selectedObj.classList.remove('sel-obj');
  selectedObj = obj;
  if(obj) obj.classList.add('sel-obj');
  updateObjBar();
}
function updateObjBar(){
  const bar = $('#imgBar');
  if(!selectedObj || !editor.contains(selectedObj)){ bar.classList.remove('show'); return; }
  const r = selectedObj.getBoundingClientRect();
  bar.classList.add('show');
  bar.style.left = Math.max(8, Math.min(window.innerWidth - bar.offsetWidth - 10, r.left)) + 'px';
  bar.style.top = (r.top > 140 ? r.top - 40 : r.bottom + 8) + 'px';
}
editor.addEventListener('click', e => {
  const obj = e.target.closest('img, .shape, .chart, .tbox, .wordart, .toc');
  if(obj){ selectObj(obj); }
  else { selectObj(null); }
});
$('#imgBar').addEventListener('click', e => {
  const b = e.target.closest('[data-obj]');
  if(!b || !selectedObj) return;
  const v = b.dataset.obj;
  if(v === 'del'){ selectedObj.remove(); selectObj(null); afterChange(); return; }
  if(v === 'left' || v === 'center' || v === 'right'){
    selectedObj.style.display = 'block';
    selectedObj.style.margin = v === 'center' ? '8px auto' : (v === 'right' ? '8px 0 8px auto' : '8px auto 8px 0');
  } else if(v === 'caption'){
    insertCaption(selectedObj);
  } else {
    const pct = parseInt(v, 10);
    const cs = getComputedStyle(editor);
    const contentW = editor.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    selectedObj.style.width = Math.round(contentW * pct / 100) + 'px';
    selectedObj.style.maxWidth = '100%';
    selectedObj.style.height = 'auto';
  }
  afterChange();
});

function buildChart(type, data){
  const W = 460, H = 260, padL = 46, padB = 40, padT = 18, padR = 14;
  const max = Math.max.apply(null, data.map(d => d.value)) || 1;
  const accent = '#185abd', alt = ['#185abd','#2e75d4','#8ab4f8','#0b6e5b','#b45309','#6b21a8'];
  let inner = '';
  if(type === 'pie'){
    const total = data.reduce((s, d) => s + d.value, 0) || 1;
    let a0 = -Math.PI / 2;
    const cx = W / 2, cy = H / 2, r = 90;
    data.forEach((d, i) => {
      const a1 = a0 + (d.value / total) * Math.PI * 2;
      const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
      const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
      const large = (a1 - a0) > Math.PI ? 1 : 0;
      inner += '<path d="M' + cx + ' ' + cy + ' L' + x0.toFixed(1) + ' ' + y0.toFixed(1)
        + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) + 'Z" fill="'
        + alt[i % alt.length] + '" opacity=".85"/>';
      const mid = (a0 + a1) / 2;
      inner += '<text x="' + (cx + r * 0.62 * Math.cos(mid)).toFixed(1) + '" y="' + (cy + r * 0.62 * Math.sin(mid)).toFixed(1)
        + '" font-size="10" fill="#fff" text-anchor="middle">' + Math.round(d.value / total * 100) + '%</text>';
      a0 = a1;
    });
  } else {
    const plotW = W - padL - padR, plotH = H - padT - padB;
    for(let i = 0; i <= 4; i++){
      const y = padT + plotH * i / 4;
      inner += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y + '" stroke="#e3e7ec"/>';
      inner += '<text x="' + (padL - 6) + '" y="' + (y + 3) + '" font-size="9" fill="#6b7280" text-anchor="end">'
        + Math.round(max * (4 - i) / 4) + '</text>';
    }
    const bw = plotW / data.length;
    data.forEach((d, i) => {
      const h = plotH * (d.value / max);
      const x = padL + bw * i + bw * 0.22;
      if(type === 'bar' || type === 'column'){
        inner += '<rect x="' + x + '" y="' + (padT + plotH - h) + '" width="' + (bw * 0.56) + '" height="' + h
          + '" fill="' + accent + '" opacity=".85" rx="2"/>';
      }
      inner += '<text x="' + (padL + bw * i + bw / 2) + '" y="' + (H - padB + 14)
        + '" font-size="9" fill="#4b5563" text-anchor="middle">' + esc(d.label.slice(0, 10)) + '</text>';
    });
    if(type === 'line'){
      const pts = data.map((d, i) => (padL + bw * i + bw / 2) + ',' + (padT + plotH - plotH * (d.value / max))).join(' ');
      inner += '<polyline points="' + pts + '" fill="none" stroke="' + accent + '" stroke-width="2.5"/>';
      data.forEach((d, i) => {
        inner += '<circle cx="' + (padL + bw * i + bw / 2) + '" cy="' + (padT + plotH - plotH * (d.value / max))
          + '" r="3" fill="' + accent + '"/>';
      });
    }
  }
  return '<svg class="chart" contenteditable="false" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" '
    + 'style="font-family:Segoe UI,Arial,sans-serif;background:#fff;border:1px solid #e3e7ec;border-radius:4px">'
    + inner + '</svg>';
}

let fnCounter = 0;
ACTIONS.footnote = function(){
  const sel = getSelection();
  const body = '<div class="field"><label>Isi catatan kaki</label><textarea id="fnText" rows="3"></textarea></div>'
    + '<p class="dlg-note">Catatan akan diberi nomor otomatis dan ditampilkan di akhir dokumen.</p>';
  openDialog({
    title:'Sisipkan catatan kaki', body, okText:'Sisipkan',
    onOk: root => {
      const text = $('#fnText', root).value.trim();
      if(!text) return false;
      return () => {
        fnCounter = $$('sup.fn', editor).length + 1;
        const id = 'fn-' + Date.now().toString(36);
        restoreSel();
        document.execCommand('insertHTML', false,
          '<sup class="fn" id="' + id + '" data-note="' + esc(text) + '">' + fnCounter + '</sup>');
        refreshFootnotes();
        afterChange();
      };
    }
  });
};
function refreshFootnotes(){
  const marks = $$('sup.fn', editor);
  let box = $('.fnbox', editor);
  if(!marks.length){ if(box) box.remove(); return; }
  marks.forEach((m, i) => { m.textContent = String(i + 1); });
  if(!box){
    box = document.createElement('div');
    box.className = 'fnbox';
    box.contentEditable = 'false';
    editor.appendChild(box);
  } else if(box !== editor.lastElementChild){
    editor.appendChild(box);
  }
  box.innerHTML = marks.map((m, i) =>
    '<p class="fnline"><sup>' + (i + 1) + '</sup> ' + esc(m.dataset.note || '') + '</p>'
  ).join('');
  if(!box.nextElementSibling){
    const tail = document.createElement('p');
    tail.innerHTML = '<br>';
    box.after(tail);
  }
}
ACTIONS.footnoteList = function(){
  const notes = $$('sup.fn', editor).map((m, i) => (i + 1) + '. ' + (m.dataset.note || ''));
  openDialog({

ACTIONS.insertTOC = function(){
  const heads = $$('h1,h2,h3', editor).filter(h => h.textContent.trim());
  if(!heads.length){ toast('Buat judul dengan gaya Judul 1–3 terlebih dahulu'); return; }
  const items = heads.map((h, i) => {
    if(!h.id) h.id = 'h-' + i + '-' + Date.now().toString(36);
    return '<a class="toc-item lv' + h.tagName[1] + '" href="#' + h.id + '" data-toc="' + h.id + '">'
      + '<span>' + esc(h.textContent.trim()) + '</span><span class="dots"></span></a>';
  }).join('');
  const html = '<div class="toc" contenteditable="false" data-toc-root="1">'
    + '<div class="toc-title">Daftar Isi</div>' + items + '</div><p><br></p>';
  const sel = getSelection();
  if(sel.rangeCount && editor.contains(sel.anchorNode)){
    document.execCommand('insertHTML', false, html);
  } else {
    editor.insertAdjacentHTML('afterbegin', html);
  }
  afterChange();
  toast('Daftar isi dibuat dari ' + heads.length + ' judul');
};

/* ----------------------------- Captions ------------------------------- */
function insertCaption(obj){
  const caps = $$('.caption, .st-caption', editor).length;
  const kind = obj && obj.tagName === 'IMG' ? 'Gambar' : obj && obj.tagName === 'TABLE' ? 'Tabel' : 'Gambar';
  const label = kind + ' ' + (caps + 1) + ': ';
  const p = document.createElement('p');
  p.className = 'caption st-caption';
  p.textContent = label;
  if(obj && obj.parentNode){
    obj.insertAdjacentElement('afterend', p);
  } else {
    const sel = getSelection();
    if(sel.rangeCount) document.execCommand('insertHTML', false, p.outerHTML);
  }
  afterChange();
  // place caret at end of caption
  const last = $$('.caption', editor).pop();
  if(last){
    const r = document.createRange();
    r.selectNodeContents(last); r.collapse(false);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    editor.focus();
  }
}

/* --------------------------- recipients store ------------------------- */
function getRecipients(){
  try{ return JSON.parse(localStorage.getItem('wordweb.recipients') || '[]'); }catch(e){ return []; }
}
function setRecipients(list){
  try{ localStorage.setItem('wordweb.recipients', JSON.stringify(list)); }catch(e){}
}
const DEFAULT_FIELDS = ['nama','jabatan','perusahaan','alamat','kota','email'];
function mergeFieldsList(){
  const recs = getRecipients();
  if(recs.length) return Object.keys(recs[0]);
  return DEFAULT_FIELDS;
}
function fillMerge(html, rec){
  return html.replace(/\{\{\s*([\w.-]+)\s*\}\}/g, (m, k) => {
    const key = Object.keys(rec).find(x => x.toLowerCase() === k.toLowerCase());
    return key ? esc(rec[key]) : m;
  });
}

ACTIONS.mergeFields = function(el){
  const fields = mergeFieldsList();
  const html = '<div class="pop-title">Sisipkan bidang</div><div class="pop-list">'
    + fields.map(f => '<button data-field="' + esc(f) + '">{{' + esc(f) + '}}</button>').join('')
    + '</div><p class="dlg-note" style="max-width:200px">Bidang akan diganti saat penggabungan.</p>';
  const p = openPopover(el, html);
  p.addEventListener('click', e => {
    const b = e.target.closest('[data-field]');
    if(!b) return;
    closePopover();
    exec('insertText', '{{' + b.dataset.field + '}}');
  });
