/* ------------------------------ ZIP writer ---------------------------- */
const CRC_TABLE = (function(){
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files){
  const enc = new TextEncoder();
  const locals = [], centrals = [];
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const data = typeof f.data === 'string' ? enc.encode(f.data) : f.data;
    const crc = crc32(data);
    const lh = new Uint8Array(30 + name.length);
    const lv = new DataView(lh.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, 0, true);
    lv.setUint16(12, 0, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, name.length, true);
    lv.setUint16(28, 0, true);
    lh.set(name, 30);
    locals.push(lh, data);

    const ch = new Uint8Array(46 + name.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true);
    cv.setUint16(14, 0, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, name.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    ch.set(name, 46);
    centrals.push(ch);

    offset += lh.length + data.length;
  });
  const centralSize = centrals.reduce((s, c) => s + c.length, 0);
  const end = new Uint8Array(22);
  const ev = new DataView(end.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  return new Blob(locals.concat(centrals, [end]), { type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
}

/* ----------------------------- HTML → OOXML --------------------------- */
function xesc(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function toHexColor(v){
  if(!v) return '';
  const m = String(v).match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if(!m) return '';
  return [1, 2, 3].map(i => ('0' + parseInt(m[i], 10).toString(16)).slice(-2)).join('').toUpperCase();
}
function runXml(text, f){
  if(!text) return '';
  let rpr = '';
  if(f.b) rpr += '<w:b/>';
  if(f.i) rpr += '<w:i/>';
  if(f.u) rpr += '<w:u w:val="single"/>';
  if(f.strike) rpr += '<w:strike/>';
  if(f.sup) rpr += '<w:vertAlign w:val="superscript"/>';
  if(f.sub) rpr += '<w:vertAlign w:val="subscript"/>';
  if(f.color) rpr += '<w:color w:val="' + f.color + '"/>';
  if(f.size) rpr += '<w:sz w:val="' + f.size + '"/><w:szCs w:val="' + f.size + '"/>';
  if(f.font) rpr += '<w:rFonts w:ascii="' + xesc(f.font) + '" w:hAnsi="' + xesc(f.font) + '"/>';
  return '<w:r>' + (rpr ? '<w:rPr>' + rpr + '</w:rPr>' : '')
    + '<w:t xml:space="preserve">' + xesc(text) + '</w:t></w:r>';
}
function runsFrom(node, fmt){
  let out = '';
  node.childNodes.forEach(n => {
    if(n.nodeType === 3){
      const t = n.nodeValue.replace(/\u00a0/g, ' ');
      if(t) out += runXml(t, fmt);
      return;
    }
    if(n.nodeType !== 1) return;
    const tag = n.tagName.toLowerCase();
    if(tag === 'br'){ out += '<w:r><w:br/></w:r>'; return; }
    if(tag === 'img'){ out += runXml('[Gambar]', fmt); return; }
    if(tag === 'sup' || tag === 'sub'){ out += runsFrom(n, Object.assign({}, fmt, tag === 'sup' ? { sup:true } : { sub:true })); return; }
    const f2 = Object.assign({}, fmt);
    if(tag === 'b' || tag === 'strong') f2.b = true;
    if(tag === 'i' || tag === 'em') f2.i = true;
    if(tag === 'u') f2.u = true;
    if(tag === 's' || tag === 'strike' || tag === 'del') f2.strike = true;
    if(n.style){
      const st = n.style;
      if(st.fontWeight === 'bold' || parseInt(st.fontWeight, 10) >= 600) f2.b = true;
      if(st.fontStyle === 'italic') f2.i = true;
      const deco = (st.textDecorationLine || st.textDecoration || '') + (st.textDecoration || '');
      if(deco.indexOf('underline') >= 0) f2.u = true;
      if(deco.indexOf('line-through') >= 0) f2.strike = true;
      if(st.color) f2.color = toHexColor(st.color) || f2.color;
      if(st.fontSize) f2.size = Math.round(parseFloat(st.fontSize) * 1.5);
      if(st.fontFamily) f2.font = st.fontFamily.split(',')[0].replace(/["']/g, '').trim();
    }
    out += runsFrom(n, f2);
  });
  return out;
}
function paraXml(el, extra){
  const tag = el.tagName.toLowerCase();
  const pPr = [];
  const hmap = { h1:'Heading1', h2:'Heading2', h3:'Heading3', h4:'Heading4', h5:'Heading5', h6:'Heading6' };
  if(hmap[tag]) pPr.push('<w:pStyle w:val="' + hmap[tag] + '"/>');
  if(el.classList.contains('st-title')) pPr.push('<w:pStyle w:val="Title"/>');
  if(tag === 'blockquote') pPr.push('<w:pBdr><w:left w:val="single" w:sz="18" w:space="8" w:color="185ABD"/></w:pBdr><w:ind w:left="340"/>');
  const jc = (el.style.textAlign || '').toLowerCase();
  if(jc) pPr.push('<w:jc w:val="' + ({ left:'left', center:'center', right:'right', justify:'both', start:'left', end:'right' }[jc] || 'left') + '"/>');
  const sp = [];
  if(el.style.marginTop) sp.push('w:before="' + Math.round(parseFloat(el.style.marginTop) * 20) + '"');
  if(el.style.marginBottom) sp.push('w:after="' + Math.round(parseFloat(el.style.marginBottom) * 20) + '"');
  if(el.style.lineHeight){
    const lh = parseFloat(el.style.lineHeight);
    if(lh) sp.push('w:line="' + Math.round(lh * 240) + '" w:lineRule="auto"');
  }
  if(sp.length) pPr.push('<w:spacing ' + sp.join(' ') + '/>');
  if(extra && extra.numId) pPr.push('<w:numPr><w:ilvl w:val="0"/><w:numId w:val="' + extra.numId + '"/></w:numPr>');
  const runs = runsFrom(el, {});
  return '<w:p>' + (pPr.length ? '<w:pPr>' + pPr.join('') + '</w:pPr>' : '') + runs + '</w:p>';
}
function blockXml(el){
  const tag = el.tagName.toLowerCase();
  if(tag === 'ul' || tag === 'ol'){
    const numId = tag === 'ul' ? 1 : 2;
    let out = '';
    Array.from(el.children).forEach(li => {
      if(li.tagName.toLowerCase() !== 'li') return;
      out += paraXml(li, { numId:numId });
      Array.from(li.children).forEach(c => {
        const t = c.tagName.toLowerCase();
        if(t === 'ul' || t === 'ol') out += blockXml(c);
      });
    });
    return out;
  }
  if(tag === 'table'){
    let out = '<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>';
    ['top','left','bottom','right','insideH','insideV'].forEach(s => {
      out += '<w:' + s + ' w:val="single" w:sz="4" w:space="0" w:color="B9C0CA"/>';
    });
    out += '</w:tblBorders></w:tblPr>';
    Array.from(el.rows).forEach(tr => {
      out += '<w:tr>';
      Array.from(tr.cells).forEach(td => {
        out += '<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/></w:tcPr>' + paraXml(td, {}) + '</w:tc>';
      });
      out += '</w:tr>';
    });
    return out + '</w:tbl>';
  }
  if(tag === 'hr') return '<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="C3C9D1"/></w:pBdr></w:pPr></w:p>';
  if(tag === 'div' && el.classList.contains('pagebreak')) return '<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
  if(el.classList.contains('fnbox')) return '';
  return paraXml(el, {});
}

/* ----------------------------- .docx import --------------------------- */
function unzipEntries(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  let eocd = -1;
  for(let i = bytes.length - 22; i >= Math.max(0, bytes.length - 66000); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('Bukan berkas ZIP/DOCX yang sah');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const out = {};
  for(let i = 0; i < count; i++){
    if(dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize = dv.getUint32(off + 20, true);
    const nlen = dv.getUint16(off + 28, true);
    const elen = dv.getUint16(off + 30, true);
    const clen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = new TextDecoder().decode(bytes.subarray(off + 46, off + 46 + nlen));
    const lnlen = dv.getUint16(lho + 26, true);
    const lelen = dv.getUint16(lho + 28, true);
    const start = lho + 30 + lnlen + lelen;
    out[name] = { method, data: bytes.subarray(start, start + csize) };
    off += 46 + nlen + elen + clen;
  }
  return out;
}
async function inflateRaw(bytes){
  if(typeof DecompressionStream === 'undefined') throw new Error('Peramban ini tidak mendukung dekompresi');
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function docxToHtml(file){
  const bytes = new Uint8Array(await file.arrayBuffer());
  const entries = unzipEntries(bytes);
  const docEntry = entries['word/document.xml'];
  if(!docEntry) throw new Error('word/document.xml tidak ditemukan');
  const raw = docEntry.method === 0 ? docEntry.data : await inflateRaw(docEntry.data);
  const xml = new DOMParser().parseFromString(new TextDecoder().decode(raw), 'application/xml');
  const body = xml.getElementsByTagName('w:body')[0];
  if(!body) throw new Error('Isi dokumen tidak terbaca');
  // map numId -> numbering format so bullets stay bullets
  const numMap = {};
  if(entries['word/numbering.xml']){
    try{
      const nEntry = entries['word/numbering.xml'];
      const nRaw = nEntry.method === 0 ? nEntry.data : await inflateRaw(nEntry.data);
      const nx = new DOMParser().parseFromString(new TextDecoder().decode(nRaw), 'application/xml');
      const abs = {};
      Array.from(nx.getElementsByTagName('w:abstractNum')).forEach(a => {
        const lvl = a.getElementsByTagName('w:lvl')[0];
        const fmt = lvl && lvl.getElementsByTagName('w:numFmt')[0];
        abs[a.getAttribute('w:abstractNumId')] = fmt ? fmt.getAttribute('w:val') : 'decimal';
      });
      Array.from(nx.getElementsByTagName('w:num')).forEach(n => {
        const a = n.getElementsByTagName('w:abstractNumId')[0];
        numMap[n.getAttribute('w:numId')] = abs[a ? a.getAttribute('w:val') : ''] || 'decimal';
      });
    }catch(e){ /* numbering optional */ }
  }
  let html = '', listBuf = '', listTag = '';
  const flush = () => { if(listBuf){ html += '<' + listTag + '>' + listBuf + '</' + listTag + '>'; listBuf = ''; listTag = ''; } };
  Array.from(body.children).forEach(node => {
    const tag = node.tagName;
    if(tag === 'w:tbl'){
      flush();
      let t = '<table>';
      Array.from(node.getElementsByTagName('w:tr')).forEach(tr => {
        t += '<tr>';
        Array.from(tr.children).forEach(tc => {
          if(tc.tagName !== 'w:tc') return;
          t += '<td>' + paraHtml(tc) + '</td>';
        });
        t += '</tr>';
      });
      html += t + '</table>';
      return;
    }
    if(tag !== 'w:p') return;
    const pPr = node.getElementsByTagName('w:pPr')[0];
    const style = pPr && pPr.getElementsByTagName('w:pStyle')[0];
    const sval = style ? style.getAttribute('w:val') : '';
    const num = pPr && pPr.getElementsByTagName('w:numPr')[0];
    const content = paraHtml(node);
    if(num){
      const nid = num.getElementsByTagName('w:numId')[0];
      const fmt = numMap[nid ? nid.getAttribute('w:val') : ''] || (/Bullet/i.test(sval) ? 'bullet' : 'decimal');
      const want = fmt === 'bullet' ? 'ul' : 'ol';
      if(listTag && listTag !== want) flush();
      listTag = want;
      listBuf += '<li>' + (content || '&nbsp;') + '</li>';
      return;
    }
    flush();
    if(/Heading1|Heading 1/i.test(sval)) html += '<h1>' + content + '</h1>';
    else if(/Heading2/i.test(sval)) html += '<h2>' + content + '</h2>';
    else if(/Heading3/i.test(sval)) html += '<h3>' + content + '</h3>';
    else if(/Title/i.test(sval)) html += '<h1 class="st-title">' + content + '</h1>';
    else html += '<p>' + (content || '<br>') + '</p>';
  });
  flush();
  return html;
}
function paraHtml(node){
  let out = '';
  const walk = (el, fmt) => {
    Array.from(el.childNodes).forEach(n => {
      if(n.nodeType === 3){
        const t = n.nodeValue;
        if(!t) return;
        let s = esc(t);
        if(fmt.b) s = '<b>' + s + '</b>';
        if(fmt.i) s = '<i>' + s + '</i>';
        if(fmt.u) s = '<u>' + s + '</u>';
        if(fmt.strike) s = '<s>' + s + '</s>';
        out += s;
        return;
      }
      if(n.nodeType !== 1) return;
      const tag = n.tagName;
      if(tag === 'w:t'){ out += esc(n.textContent); return; }
      if(tag === 'w:br'){ out += '<br>'; return; }
      if(tag === 'w:tab'){ out += '\u00a0\u00a0'; return; }
      if(tag === 'w:r'){
        const rPr = n.getElementsByTagName('w:rPr')[0];
        const f = { b:false, i:false, u:false, strike:false };
        if(rPr){
          f.b = !!rPr.getElementsByTagName('w:b')[0];
          f.i = !!rPr.getElementsByTagName('w:i')[0];
          f.u = !!rPr.getElementsByTagName('w:u')[0];
          f.strike = !!rPr.getElementsByTagName('w:strike')[0];
        }
        Array.from(n.childNodes).forEach(c => {
          if(c.nodeType === 1 && c.tagName === 'w:t'){ out += runWrap(esc(c.textContent), f); }
          else if(c.nodeType === 1 && c.tagName === 'w:br'){ out += '<br>'; }
          else if(c.nodeType === 1 && c.tagName === 'w:tab'){ out += '\u00a0\u00a0'; }
        });
        return;
      }
      walk(n, fmt);
    });
  };
  walk(node, { b:false, i:false, u:false, strike:false });
  return out;
}
function runWrap(text, f){
  let s = text;
  if(f.strike) s = '<s>' + s + '</s>';
  if(f.u) s = '<u>' + s + '</u>';
  if(f.i) s = '<i>' + s + '</i>';
  if(f.b) s = '<b>' + s + '</b>';
  return s;
}

/* ---------------------------- Find & replace -------------------------- */
let hits = [], hitIdx = -1;
const findBar = $('#findBar');
function openFind(replace){
  findBar.classList.add('show');
  findBar.style.top = Math.max(60, ribbon.getBoundingClientRect().bottom + 10) + 'px';
  const inp = $('#findInput');
  const selText = getSelection().toString();
  if(selText && selText.length < 80) inp.value = selText;
  collectHits(inp.value);
  if(hits.length) showHit(0);
  (replace ? $('#replInput') : inp).focus();
  if(!replace) inp.select();
}
function closeFind(){
  findBar.classList.remove('show');
  getSelection().removeAllRanges();
  editor.focus();
}
function collectHits(q){
  hits = []; hitIdx = -1;
  if(!q){ updateFindCount(); return; }
  const cs = $('#findCase').checked, ww = $('#findWord').checked;
  const needle = cs ? q : q.toLowerCase();
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      if(n.parentElement && n.parentElement.closest('[contenteditable="false"]')) return NodeFilter.FILTER_REJECT;
      if(n.parentElement && n.parentElement.closest('.fnbox,.toc')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  let n;
  while((n = walker.nextNode())){
    const raw = n.nodeValue;
    const hay = cs ? raw : raw.toLowerCase();
    let i = hay.indexOf(needle);
    while(i !== -1){
      const before = i === 0 ? '' : hay[i - 1];
      const after = i + q.length >= hay.length ? '' : hay[i + q.length];
      const okWord = !ww || (!/[\wÀ-ÿ]/.test(before) && !/[\wÀ-ÿ]/.test(after));
      if(okWord){
        const r = document.createRange();
        r.setStart(n, i); r.setEnd(n, i + q.length);
        hits.push(r);
      }
      i = hay.indexOf(needle, i + Math.max(1, q.length));
    }
  }
  updateFindCount();
}
function showHit(i){
  if(!hits.length) return;
  hitIdx = ((i % hits.length) + hits.length) % hits.length;
  const r = hits[hitIdx];
  const s = getSelection();
  s.removeAllRanges(); s.addRange(r);
  const el = r.startContainer.parentElement;
  if(el) el.scrollIntoView({ block:'center', behavior:'smooth' });
  updateFindCount();
}
function updateFindCount(){
  $('#findCount').textContent = hits.length ? (hitIdx + 1) + '/' + hits.length : '0/0';
}
$('#findInput').addEventListener('input', e => { collectHits(e.target.value); if(hits.length) showHit(0); });
$('#findInput').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); showHit(hitIdx + (e.shiftKey ? -1 : 1)); }
  if(e.key === 'Escape') closeFind();
});
$('#findCase').addEventListener('change', () => collectHits($('#findInput').value));
$('#findWord').addEventListener('change', () => collectHits($('#findInput').value));
$('#findNext').onclick = () => showHit(hitIdx + 1);
$('#findPrev').onclick = () => showHit(hitIdx - 1);
$('#findClose').onclick = closeFind;
$('#replaceOne').onclick = () => {
  if(hitIdx < 0 || !hits.length) return;
  const r = hits[hitIdx];
  r.deleteContents();
  r.insertNode(document.createTextNode($('#replInput').value));
  afterChange();
  collectHits($('#findInput').value);
  if(hits.length) showHit(Math.min(hitIdx, hits.length - 1));
};
$('#replaceAll').onclick = () => {
  const q = $('#findInput').value;
  if(!q) return;
  collectHits(q);
  const total = hits.length;
  const val = $('#replInput').value;
  for(let i = hits.length - 1; i >= 0; i--){
    const r = hits[i];
    r.deleteContents();
    r.insertNode(document.createTextNode(val));
  }
  afterChange();
  collectHits(q);
  $('#findCount').textContent = total + ' diganti';
};

editor.addEventListener('beforeinput', e => {
  if(!trackOn) return;
  if(e.inputType === 'insertText' && e.data){
    e.preventDefault();
    document.execCommand('insertHTML', false, '<ins class="trk">' + esc(e.data) + '</ins>');
    afterChange();
    return;
  }
  if(e.inputType === 'deleteContentBackward' || e.inputType === 'deleteContentForward'){
    if(trackDelete(e.inputType === 'deleteContentForward')) e.preventDefault();
  }
});
function trackDelete(forward){
  const sel = getSelection();
  if(!sel.rangeCount) return false;
  let r = sel.getRangeAt(0);
  if(r.collapsed){
    const n = r.startContainer;
    if(n.nodeType !== 3) return false;
    const off = r.startOffset;
    if(!forward && off > 0){ r = document.createRange(); r.setStart(n, off - 1); r.setEnd(n, off); }
    else if(forward && off < n.nodeValue.length){ r = document.createRange(); r.setStart(n, off); r.setEnd(n, off + 1); }
    else return false;
  }
  const frag = r.extractContents();
  if(!frag.textContent) return false;
  const del = document.createElement('del');
  del.className = 'trk';
  del.contentEditable = 'false';
  del.appendChild(frag);
  r.insertNode(del);
  const nr = document.createRange();
  nr.setStartBefore(del); nr.collapse(true);
  sel.removeAllRanges(); sel.addRange(nr);
  afterChange();
  return true;
}

let protectedDoc = false;
function hash(str){
  let h = 5381;
  for(let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
  return String(h);
}

/* --------------------------- Compare documents ------------------------ */
ACTIONS.compareDoc = function(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.html,.txt,.md';
  input.onchange = () => {
    const f = input.files && input.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const doc = new DOMParser().parseFromString(String(ev.target.result), 'text/html');
      const other = (doc.body.innerText || '').split(/\n+/).map(s => s.trim()).filter(Boolean);
      const mine = (editor.innerText || '').split(/\n+/).map(s => s.trim()).filter(Boolean);
      const otherSet = new Set(other), mineSet = new Set(mine);
      const added = mine.filter(l => !otherSet.has(l));
      const removed = other.filter(l => !mineSet.has(l));
      const body = '<p><b>' + added.length + '</b> baris hanya ada di dokumen ini, <b>' + removed.length + '</b> baris hanya ada di berkas pembanding.</p>'
        + (added.length ? '<h4 style="margin:10px 0 4px">Hanya di sini</h4><div style="max-height:160px;overflow:auto;font-size:12px">'
          + added.map(l => '<div style="background:#e7f6ec;padding:2px 6px;border-radius:3px;margin-bottom:2px">' + esc(l) + '</div>').join('') + '</div>' : '')
        + (removed.length ? '<h4 style="margin:10px 0 4px">Hanya di berkas pembanding</h4><div style="max-height:160px;overflow:auto;font-size:12px">'
          + removed.map(l => '<div style="background:#fdecea;padding:2px 6px;border-radius:3px;margin-bottom:2px">' + esc(l) + '</div>').join('') + '</div>' : '');
      openDialog({ title:'Bandingkan: ' + esc(f.name), body, okText:false, cancelText:'Tutup' });
    };
    reader.readAsText(f);
  };
  input.click();
};

function renderBackstage(view){
  bsView = view;

    ['new','Baru'], ['open','Buka'], ['info','Info'], ['save','Simpan'],

    + '<button class="bs-close" data-bs="close">Tutup dokumen</button></div>'
    + '<div class="bs-body" id="bsBody"></div>';
  backstage.querySelector('.bs-menu').addEventListener('click', e => {
    const b = e.target.closest('[data-bs]');
    if(!b) return;
    if(b.dataset.bs === 'close'){ closeBackstage(); switchTab('home'); return; }
    renderBackstage(b.dataset.bs);
  });

    body.innerHTML = '<h2>Baru</h2><p class="sub">Mulai dari dokumen kosong atau templat siap pakai.</p>'

          + '<b>' + t.name + '</b><span>' + t.desc + '</span></button>';

      const b = e.target.closest('[data-tpl]');

function newDocument(tplKey){
  const t = TEMPLATES[tplKey] || TEMPLATES.blank;
  docId = 'doc-' + Date.now().toString(36);
  editor.innerHTML = t.html;
  docHeader.innerHTML = ''; docFooter.innerHTML = '';
  docHeader.classList.add('off'); docFooter.classList.add('off');
  $('#watermark').classList.remove('show');
  $('#docName').value = tplKey === 'blank' ? 'Dokumen Tanpa Judul' : t.name;
  document.title = $('#docName').value + ' — Word Web';
  editor.style.fontFamily = settings.font + ', Calibri, Arial, sans-serif';
  editor.style.fontSize = settings.size + 'pt';
  closeBackstage();
  switchTab('home');
  afterChange(); saveLocal(false);
  editor.focus();
}

/* ----------------------------- Keyboard ------------------------------- */
document.addEventListener('keydown', e => {
  const ctrl = e.ctrlKey || e.metaKey;
  const inEd = inEditor() || document.activeElement === docHeader || document.activeElement === docFooter;
  if(e.key === 'Escape'){
    if(document.body.classList.contains('focusmode')){ document.body.classList.remove('focusmode'); return; }
    if(ctx.classList.contains('show')){ ctx.classList.remove('show'); return; }
    if(findBar.classList.contains('show')){ closeFind(); return; }
    if(miniBar.classList.contains('show')){ miniBar.classList.remove('show'); return; }
  }
  if(!inEd) return;
  if(ctrl && !e.altKey){
    const k = e.key.toLowerCase();
    if(k === 's'){ e.preventDefault(); if(e.shiftKey){ closeBackstage(); openBackstage('saveas'); } else saveHtmlFile(); return; }
    if(k === 'p'){ e.preventDefault(); printDoc(); return; }
    if(k === 'f'){ e.preventDefault(); openFind(false); return; }
    if(k === 'h'){ e.preventDefault(); openFind(true); return; }
    if(k === 'k'){ e.preventDefault(); ACTIONS.link(); return; }
    if(k === 'o'){ e.preventDefault(); openFileDialog(); return; }
  }
  if(ctrl && e.altKey){
    const n = e.key;
    if(n === '1' || n === '2' || n === '3'){ e.preventDefault(); document.execCommand('formatBlock', false, '<h' + n + '>'); afterChange(); return; }
    if(n === '0'){ e.preventDefault(); document.execCommand('formatBlock', false, '<p>'); afterChange(); return; }
  }
  if(ctrl && e.shiftKey){
    const k = e.key.toLowerCase();
    if(k === 'x'){ e.preventDefault(); exec('strikeThrough'); return; }
    if(k === 'l'){ e.preventDefault(); exec('insertUnorderedList'); return; }
    if(k === '7'){ e.preventDefault(); exec('insertOrderedList'); return; }
    if(k === 'v'){ return; }
  }
  if(e.key === 'F7'){ e.preventDefault(); editor.spellcheck = true; toast('Pemeriksaan ejaan aktif — garis bawah merah dari peramban'); return; }
  if(e.key === 'Enter' && ctrl && !e.shiftKey){ e.preventDefault(); ACTIONS.pageBreak(); return; }
  if(e.key === 'Tab' && !ctrl && !e.altKey && document.activeElement === editor){
    const li = caretNode() && caretNode().closest ? caretNode().closest('li') : null;
    e.preventDefault();
    if(li && !e.shiftKey) document.execCommand('indent');
    else if(li && e.shiftKey) document.execCommand('outdent');
    else document.execCommand('insertText', false, '\u00a0\u00a0\u00a0\u00a0');
    afterChange();
  }
});

/* ------------------------------ Wiring -------------------------------- */
editor.addEventListener('input', () => { convertFontTags(); afterChange(); });
editor.addEventListener('keyup', updateToolbar);
editor.addEventListener('mouseup', () => { saveSel(); updateToolbar(); });
document.addEventListener('selectionchange', () => { if(inEditor()){ saveSel(); updateToolbar(); } });
editor.addEventListener('focus', updateToolbar);
[docHeader, docFooter].forEach(h => {
  h.addEventListener('input', () => { markDirty(); queueSave(); });
  h.addEventListener('focus', () => { h.classList.remove('off'); });
});

ribbon.addEventListener('mousedown', e => { if(e.target.closest('.rb')) e.preventDefault(); });
ribbon.addEventListener('click', e => {
  const b = e.target.closest('.rb');
  if(!b) return;
  if(b.dataset.action && ACTIONS[b.dataset.action]){ ACTIONS[b.dataset.action](b); return; }
  if(b.dataset.cmd){ exec(b.dataset.cmd, b.dataset.val === undefined ? null : b.dataset.val); }
});
ribbon.addEventListener('change', e => {
  const el = e.target;
  if(el.tagName !== 'SELECT') return;
  switch(el.id){
    case 'fontName': exec('fontName', el.value); break;
    case 'fontSize': setFontSize(el.value); break;
    case 'margin': {
      const m = MARGIN_VALUES[el.value] || MARGIN_VALUES.normal;
      pageSetup.padX = m.x; pageSetup.padY = m.y; pageSetup.marginPreset = el.value;
      pageEl.style.padding = '';
      applyPageSetup();
      break;
    }
    case 'pageSize': {
      if(el.value === 'custom'){
        ask('Ukuran kertas khusus', 'Masukkan ukuran (mis. 21cm x 29.7cm)', '21cm x 29.7cm').then(v => {
          if(!v) return;
          const m = v.split(/x|×/);
          if(m.length === 2){ pageSetup.w = m[0].trim(); pageSetup.h = m[1].trim(); applyPageSetup(); }
        });
      } else {
        pageSetup.size = el.value;
        const s = PAGE_SIZES[el.value];
        pageSetup.w = pageSetup.orient === 'portrait' ? s[0] : s[1];
        pageSetup.h = pageSetup.orient === 'portrait' ? s[1] : s[0];
        applyPageSetup();
      }
      break;
    }
  }
  updateToolbar();
});
ribbon.addEventListener('input', e => {
  const el = e.target;
  if(el.type !== 'color') return;
  if(el.id === 'foreColor') exec('foreColor', el.value);
  if(el.id === 'hilite') exec('hiliteColor', el.value);
  if(el.id === 'paraShade'){ blocksInSelection().forEach(b => b.style.backgroundColor = el.value); afterChange(); }
  if(el.id === 'pageColor') pageEl.style.backgroundColor = el.value;
});

$$('[data-top]').forEach(b => b.addEventListener('click', () => {
  const a = b.dataset.top;
  if(a === 'save') saveHtmlFile();
  if(a === 'doc') exportDoc();
  if(a === 'pdf') printDoc();
  if(a === 'new') openBackstage('new');
  if(a === 'open') openFileDialog();
  if(a === 'theme'){ settings.theme = settings.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = settings.theme; saveSettings(); }
}));

$$('[data-action]').forEach(el => {
  if(el.classList.contains('rb') || el.classList.contains('vbtn') || el.classList.contains('stat')) return;
  el.addEventListener('click', () => { if(ACTIONS[el.dataset.action]) ACTIONS[el.dataset.action](el); });
});
$$('.vbtn').forEach(b => b.addEventListener('click', () => { if(ACTIONS[b.dataset.action]) ACTIONS[b.dataset.action](b); }));
$$('.stat').forEach(b => b.addEventListener('click', () => { if(ACTIONS[b.dataset.action]) ACTIONS[b.dataset.action](b); }));

document.addEventListener('mousedown', e => {
  if(!ctx.contains(e.target)) ctx.classList.remove('show');
}, true);
window.addEventListener('scroll', () => { $('#tableBar').classList.remove('show'); $('#imgBar').classList.remove('show'); miniBar.classList.remove('show'); }, true);

  + '<li>Ekspor <b>.doc</b> (dibuka di Word), <b>.html</b>, <b>.md</b>, <b>.txt</b>, serta PDF lewat cetak</li>'
  + '</ul>'
  + '<h2>Mulai cepat</h2>'
  + '<table><thead><tr><th>Ingin</th><th>Lakukan</th></tr></thead><tbody>'
  + '<tr><td>Menebalkan teks</td><td>Pilih teks, tekan <b>Ctrl</b> + <b>B</b></td></tr>'
  + '<tr><td>Membuat judul</td><td><b>Ctrl</b> + <b>Alt</b> + <b>1</b> sampai <b>3</b></td></tr>'

  + '<tr><td>Menyimpan</td><td><b>Ctrl</b> + <b>S</b> untuk HTML, tab <b>Berkas</b> untuk format lain</td></tr>'
  + '</tbody></table>'
  + '<p>Buka tab <b>Berkas</b> untuk templat surat, laporan, CV, dan notulen. Selamat menulis.</p>'
  + '<p><br></p>';

function init(){
  try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
  try{ document.execCommand('defaultParagraphSeparator', false, 'p'); }catch(e){}

  loadSettings();
  document.documentElement.dataset.theme = settings.theme;
  document.documentElement.dataset.canvas = settings.canvas;
  editor.spellcheck = settings.spell;
  editor.classList.toggle('marks', settings.marks);
  $('#rulerRow').classList.toggle('show', settings.ruler);
  $('#navPane').classList.toggle('show', settings.nav);
  $('#autoSaveBtn').style.opacity = settings.autosave ? '1' : '.45';

  let rec = null;
  try{ rec = JSON.parse(localStorage.getItem('wordweb.doc') || 'null'); }catch(e){}
  if(rec && rec.html){
    docId = rec.id || docId;
    editor.innerHTML = rec.html;
    docHeader.innerHTML = rec.header || '';
    docFooter.innerHTML = rec.footer || '';
    $('#docName').value = rec.name || 'Dokumen Tanpa Judul';
    if(rec.hfOn){
      docHeader.classList.toggle('off', !rec.hfOn.h);
      docFooter.classList.toggle('off', !rec.hfOn.f);
    }
    if(rec.page) pageSetup = Object.assign({}, pageSetup, rec.page);
  } else {
    editor.innerHTML = WELCOME;
    editor.style.fontFamily = settings.font + ', Calibri, Arial, sans-serif';
    editor.style.fontSize = settings.size + 'pt';
  }

  document.title = $('#docName').value + ' — Word Web';
  $('#docName').addEventListener('input', () => {
    document.title = $('#docName').value + ' — Word Web';
    markDirty(); queueSave();
  });

  applyPageSetup();
  $('#fontName').value = settings.font;
  $('#fontSize').value = String(settings.size);
  setZoom(100);
  updateStats();
  updateToolbar();
  refreshFootnotes();
  drawRuler();
  $('#saveState').textContent = settings.autosave ? 'Tersimpan otomatis' : 'Siap';

  editor.focus();
  const r = document.createRange();
  r.selectNodeContents(editor);
  r.collapse(true);
  const s = getSelection();
  s.removeAllRanges(); s.addRange(r);
}

window.addEventListener('beforeunload', () => { if(dirty) saveLocal(true); });

try{
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
}catch(e){}

init();
})();
